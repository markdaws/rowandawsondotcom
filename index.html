                ctx.fillStyle = skinDark;
                ctx.fillRect(drawX + 8*s + attackOffset, baseY + 2*s, p, p*4);
                ctx.fillRect(drawX + 8*s + attackOffset, baseY + 14*s, p*5, p);

                // Messy hair (different for each type)
                ctx.fillStyle = this.type === ZOMBIE_TYPE.RADIOACTIVE ? '#205020' :
                               this.type === ZOMBIE_TYPE.FAST ? '#506070' :
                               this.type === ZOMBIE_TYPE.JUMPING ? '#402020' :
                               this.type === ZOMBIE_TYPE.LARGE ? '#202020' : '#3a4a3a';
                ctx.fillRect(drawX + 6*s + attackOffset, baseY, p*6, p);
                ctx.fillRect(drawX + 4*s + attackOffset, baseY + 2*s, p, p*2);
                ctx.fillRect(drawX + 26*s + attackOffset, baseY + 2*s, p, p);

                // Type-specific features
                if (this.type === ZOMBIE_TYPE.JUMPING) {
                    // Horns for jumping zombie
                    ctx.fillStyle = '#402020';
                    ctx.fillRect(drawX + 6*s + attackOffset, baseY - 4*s, p, p*2);
                    ctx.fillRect(drawX + 24*s + attackOffset, baseY - 4*s, p, p*2);
                }
                if (this.type === ZOMBIE_TYPE.LARGE) {
                    // Spikes on shoulders for large zombie
                    ctx.fillStyle = '#3a3a3a';
                    ctx.fillRect(drawX + 2*s + attackOffset, baseY + 16*s, p, p*2);
                    ctx.fillRect(drawX + 30*s + attackOffset, baseY + 16*s, p, p*2);
                }

                // Glowing eyes
                ctx.fillStyle = eyeColor;
                ctx.fillRect(drawX + 10*s + attackOffset, baseY + 6*s, p, p);
                ctx.fillRect(drawX + 18*s + attackOffset, baseY + 6*s, p, p);

                // Eye glow effect
                ctx.fillStyle = eyeGlow;
                ctx.fillRect(drawX + 8*s + attackOffset, baseY + 4*s, p*2, p*2);
                ctx.fillRect(drawX + 16*s + attackOffset, baseY + 4*s, p*2, p*2);

                // Mouth/teeth
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(drawX + 12*s + attackOffset, baseY + 12*s, p*2, p);
                ctx.fillStyle = '#dddddd';
                ctx.fillRect(drawX + 13*s + attackOffset, baseY + 12*s, 2*s, 2*s);
                ctx.fillRect(drawX + 17*s + attackOffset, baseY + 12*s, 2*s, 2*s);

                // Arms reaching forward
                ctx.fillStyle = skinColor;
                const armExtend = (this.isAttacking ? -10 : -4) * s;
                ctx.fillRect(drawX + armExtend + attackOffset, baseY + 20*s, p*3, p*2);
                ctx.fillRect(drawX + armExtend - 4*s + attackOffset, baseY + 22*s, p*2, p*2);

                // Claw hand
                ctx.fillStyle = skinDark;
                ctx.fillRect(drawX + armExtend - 6*s + attackOffset, baseY + 20*s, p, p);
                ctx.fillRect(drawX + armExtend - 6*s + attackOffset, baseY + 24*s, p, p);
                ctx.fillRect(drawX + armExtend - 6*s + attackOffset, baseY + 28*s, p, p);

                ctx.restore(); // Restore from squash/knockback transform
                ctx.globalAlpha = 1;

                // Health bar (only if alive and damaged)
                if (!this.dead && this.health < this.maxHealth) {
                    this.drawHealthBar();
                }

                // Draw radioactive warning indicator
                if (this.type === ZOMBIE_TYPE.RADIOACTIVE && !this.dead) {
                    ctx.fillStyle = 'rgba(100, 255, 100, ' + (0.3 + Math.sin(this.wobble * 2) * 0.2) + ')';
                    ctx.beginPath();
                    ctx.arc(this.x + this.width/2, this.y + this.height/2, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            mixColors(color1, color2, mix) {
                const r1 = parseInt(color1.slice(1, 3), 16);
                const g1 = parseInt(color1.slice(3, 5), 16);
                const b1 = parseInt(color1.slice(5, 7), 16);
                const r2 = parseInt(color2.slice(1, 3), 16);
                const g2 = parseInt(color2.slice(3, 5), 16);
                const b2 = parseInt(color2.slice(5, 7), 16);
                const r = Math.round(r1 + (r2 - r1) * mix);
                const g = Math.round(g1 + (g2 - g1) * mix);
                const b = Math.round(b1 + (b2 - b1) * mix);
                return `rgb(${r},${g},${b})`;
            }

            drawHealthBar() {
                const barWidth = 30 * this.scale;
                const barHeight = 5 * this.scale;
                const barX = this.x + (this.width - barWidth) / 2;
                const barY = this.y - 10 * this.scale;

                // Background
                ctx.fillStyle = '#333';
                ctx.fillRect(barX, barY, barWidth, barHeight);

                // Health - color based on type
                const healthPercent = this.health / this.maxHealth;
                let healthColor;
                if (this.type === ZOMBIE_TYPE.RADIOACTIVE) {
                    healthColor = '#50ff50';
                } else if (this.type === ZOMBIE_TYPE.FAST) {
                    healthColor = '#50ffff';
                } else if (this.type === ZOMBIE_TYPE.TITAN) {
                    healthColor = '#ff00ff';
                } else {
                    healthColor = healthPercent > 0.5 ? '#4CAF50' : healthPercent > 0.25 ? '#FF9800' : '#f44336';
                }
                ctx.fillStyle = healthColor;
                ctx.fillRect(barX, barY, barWidth * healthPercent, barHeight);

                // Border
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY, barWidth, barHeight);

                // Type indicator for special zombies
                if (this.type !== ZOMBIE_TYPE.NORMAL) {
                    ctx.font = (8 * this.scale) + 'px Courier New';
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    const label = this.type === ZOMBIE_TYPE.FAST ? 'FAST' :
                                 this.type === ZOMBIE_TYPE.RADIOACTIVE ? 'RAD' :
                                 this.type === ZOMBIE_TYPE.JUMPING ? 'JUMP' :
                                 this.type === ZOMBIE_TYPE.LARGE ? 'MINI BOSS' :
                                 this.type === ZOMBIE_TYPE.TITAN ? 'TITAN' : '';
                    ctx.fillText(label, this.x + this.width/2, barY - 2);
                }
            }

            update(deltaTime, currentTime, base) {
                // Decay juice effects
                this.knockback *= 0.9;
                this.hitFlash -= deltaTime * 10;
                if (this.hitFlash < 0) this.hitFlash = 0;
                this.squashX += (1 - this.squashX) * deltaTime * 12;
                this.squashY += (1 - this.squashY) * deltaTime * 12;

                // Apply knockback physics - actually move the zombie
                if (Math.abs(this.knockbackVelocity) > 5) {
                    this.x += this.knockbackVelocity * deltaTime;
                    // Apply friction (decelerate) - lose ~90% velocity over ~0.3 seconds
                    const friction = Math.pow(0.001, deltaTime);
                    this.knockbackVelocity *= friction;
                    // Keep zombie in bounds
                    if (this.x > CANVAS_WIDTH - this.width) {
                        this.x = CANVAS_WIDTH - this.width;
                        this.knockbackVelocity = 0;
                    }
                    // If knocked back from base, no longer at base
                    if (this.atBase && this.x > base.x + base.width + 10) {
                        this.atBase = false;
                    }
                } else {
                    this.knockbackVelocity = 0;
                }

                if (this.dead) {
                    this.fadeOut -= deltaTime * 2;
                    this.deathRotation += deltaTime * 5;
                    this.deathVelocityY += 500 * deltaTime;
                    this.y += this.deathVelocityY * deltaTime;
                    return { remove: this.fadeOut <= 0 || this.y > CANVAS_HEIGHT + 50, damage: 0, radioactiveDeath: false };
                }

                this.wobble += deltaTime * 8;
                this.isAttacking = false;

                // Jumping zombie behavior
                if (this.type === ZOMBIE_TYPE.JUMPING && !this.atBase) {
                    this.jumpTimer += deltaTime * 1000;

                    // Jump periodically
                    if (this.jumpTimer >= this.jumpInterval && !this.isJumping) {
                        this.isJumping = true;
                        this.velocityY = -350;
                        this.jumpTimer = 0;
                    }

                    // Apply gravity
                    if (this.isJumping || this.y < this.groundY) {
                        this.velocityY += 800 * deltaTime;
                        this.y += this.velocityY * deltaTime;

                        if (this.y >= this.groundY) {
                            this.y = this.groundY;
                            this.velocityY = 0;
                            this.isJumping = false;
                        }
                    }
                }

                // If at base, attack periodically
                if (this.atBase) {
                    const timeSinceReached = currentTime - this.reachedBaseTime;

                    // Radioactive zombie explodes after 10 seconds at base
                    if (this.type === ZOMBIE_TYPE.RADIOACTIVE && timeSinceReached >= 10000 && !this.hasExploded) {
                        this.hasExploded = true;
                        this.dead = true;
                        return { remove: false, damage: 50, radioactiveExplosion: true };
                    }

                    // Normal disappear after 10 seconds (non-radioactive)
                    if (this.type !== ZOMBIE_TYPE.RADIOACTIVE && timeSinceReached >= 10000) {
                        return { remove: true, damage: 0, radioactiveDeath: false };
                    }

                    // Wait 1 second before first attack
                    if (timeSinceReached >= ZOMBIE_ATTACK_DELAY) {
                        // Attack every 0.5 seconds
                        if (currentTime - this.lastAttackTime >= ZOMBIE_ATTACK_INTERVAL) {
                            this.lastAttackTime = currentTime;
                            this.isAttacking = true;
                            return { remove: false, damage: ZOMBIE_BASE_DAMAGE, radioactiveDeath: false };
                        }
                    }
                    return { remove: false, damage: 0, radioactiveDeath: false };
                }

                // Move toward base
                this.x -= this.speed * deltaTime;

                // Check if reached base
                if (this.x <= base.x + base.width) {
                    this.x = base.x + base.width;
                    this.atBase = true;
                    this.reachedBaseTime = currentTime;
                }

                return { remove: false, damage: 0, radioactiveDeath: false };
            }

            takeDamage(amount, knockbackAmount = 15) {
                this.health -= amount;

                // Hit juice - scale knockback for large zombies
                this.knockback = knockbackAmount / this.scale;
                // Physics knockback - push zombie back (positive = right)
                this.knockbackVelocity = (knockbackAmount * 15) / this.scale;
                this.hitFlash = 1;
                this.squashX = 1.3;
                this.squashY = 0.7;

                if (this.health <= 0) {
                    this.dead = true;
                    this.deathVelocityY = -150 / this.scale;
                    return { died: true, isRadioactive: this.type === ZOMBIE_TYPE.RADIOACTIVE };
                }
                return { died: false, isRadioactive: false };
            }

            // Get center position for radioactive effect
            getCenter() {
                return {
                    x: this.x + this.width / 2,
                    y: this.y + this.height / 2
                };
            }

            getHitbox() {
                return {
                    x: this.x,
                    y: this.y,
                    width: this.width,
                    height: this.height
                };
            }
        }

        // ============================================
        // PROJECTILE CLASS
        // ============================================
        class Projectile {
            constructor(x, y, direction = 1) {
                this.x = x;
                this.y = y;
                this.direction = direction; // 1 = right, -1 = left
                this.width = 10;
                this.height = 5;
                this.speed = PROJECTILE_SPEED;
                this.damage = SHOOT_DAMAGE;
                this.trail = [];
                this.trailLength = 8;
            }

            draw() {
                const p = 3; // Pixel size

                // Draw pixelated trail
                for (let i = 0; i < this.trail.length; i++) {
                    const t = this.trail[i];
                    const alpha = (i / this.trail.length) * 0.7;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = '#ff8800';
                    ctx.fillRect(t.x - p/2, t.y - p/2, p, p);
                    if (i % 2 === 0) {
                        ctx.fillStyle = '#ffaa44';
                        ctx.fillRect(t.x - p/2, t.y - p, p, p);
                    }
                }
                ctx.globalAlpha = 1;

                // Glow effect (Terraria-style magic projectile)
                ctx.fillStyle = 'rgba(255, 200, 100, 0.4)';
                ctx.fillRect(this.x - 8, this.y - 4, 16, 8);

                // Bullet body (pixelated)
                ctx.fillStyle = '#ffdd44';
                ctx.fillRect(this.x - 4, this.y - 2, p*3, p*2);

                // Bullet highlight
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(this.x + 2, this.y - 1, p, p);

                // Bullet dark edge
                ctx.fillStyle = '#cc9900';
                ctx.fillRect(this.x - 4, this.y + 1, p, p);

                // Sparkle particles
                const sparkle = Math.random();
                if (sparkle > 0.7) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(this.x + Math.random() * 10 - 5, this.y + Math.random() * 6 - 3, 2, 2);
                }
            }

            update(deltaTime) {
                // Add to trail
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }

                this.x += this.speed * deltaTime * this.direction;
                // Remove if off screen (either side)
                return this.x > CANVAS_WIDTH || this.x < 0;
            }

            getHitbox() {
                return {
                    x: this.x - this.width / 2,
                    y: this.y - this.height / 2,
                    width: this.width,
                    height: this.height
                };
            }
        }

        // ============================================
        // GAME CLASS
        // ============================================
        class Game {
            constructor() {
                this.state = SPLASH;
                this.player = new Player();
                this.base = new Base();
                this.zombies = [];
                this.projectiles = [];
                this.score = 0;
                this.highScore = 0;
                this.spawnInterval = INITIAL_SPAWN_INTERVAL;
                this.lastSpawnTime = 0;
                this.lastTime = 0;
                this.keys = {};
                this.keysJustPressed = {};
                this.hitEffects = [];
                this.splashMusicStarted = false;
                this.pendingGroundSmash = false;

                // Juice systems
                this.screenEffects = new ScreenEffects();
                this.particles = new ParticleSystem();
                this.damageNumbers = [];

                // Terraria-style background
                this.background = new Background();

                // Player slowdown from radioactive zombies
                this.playerSlowedUntil = 0;
                this.playerNormalSpeed = PLAYER_SPEED;

                // Track score for large zombie spawning (every 100 points)
                this.lastLargeZombieScore = 0;

                // Titan announcement and tracking
                this.titanAnnouncement = false;
                this.titanAnnouncementTime = 0;
                this.activeTitan = null;

                this.setupInput();
            }

            setupInput() {
                // Initialize sound on first interaction
                const initSound = () => {
                    soundManager.init();
                    soundManager.resume();
                    if (this.state === SPLASH && !this.splashMusicStarted) {
                        soundManager.playSplashMusic();
                        this.splashMusicStarted = true;
                    }
                };

                // Keyboard input
                window.addEventListener('keydown', (e) => {
                    initSound();
                    const key = e.key.toLowerCase();
                    const wasPressed = this.keys[key];
                    this.keys[key] = true;

                    // Track if key was just pressed (for tap detection)
                    if (!wasPressed) {
                        this.keysJustPressed[key] = true;
                    }

                    if (e.key === ' ') {
                        e.preventDefault();
                        if (this.state === SPLASH) {
                            this.startGame();
                        } else if (this.state === GAME_OVER) {
                            this.startGame();
                        } else if (this.state === PLAYING && !wasPressed) {
                            // Only punch on fresh key press (tap)
                            this.handlePunch();
                        }
                    }

                    if (key === 'q' && this.state === PLAYING) {
                        this.handleShoot();
                    }

                    if (key === 'w' && this.state === PLAYING && !wasPressed) {
                        this.handleJump();
                    }

                    if (key === 's' && this.state === PLAYING && !wasPressed) {
                        this.handleGroundSmash();
                    }
                });

                window.addEventListener('keyup', (e) => {
                    this.keys[e.key.toLowerCase()] = false;
                    this.keysJustPressed[e.key.toLowerCase()] = false;
                });

                // Touch controls
                const btnLeft = document.getElementById('btnLeft');
                const btnRight = document.getElementById('btnRight');
                const btnPunch = document.getElementById('btnPunch');
                const btnShoot = document.getElementById('btnShoot');
                const btnJump = document.getElementById('btnJump');
                const btnSmash = document.getElementById('btnSmash');

                // Movement buttons
                btnLeft.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.keys['a'] = true;
                });
                btnLeft.addEventListener('touchend', () => this.keys['a'] = false);

                btnRight.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.keys['d'] = true;
                });
                btnRight.addEventListener('touchend', () => this.keys['d'] = false);

                // Attack buttons
                btnPunch.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    initSound();
                    if (this.state === SPLASH || this.state === GAME_OVER) {
                        this.startGame();
                    } else {
                        this.handlePunch();
                    }
                });

                btnShoot.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    initSound();
                    if (this.state === PLAYING) {
                        this.handleShoot();
                    }
                });

                btnJump.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    initSound();
                    if (this.state === PLAYING) {
                        this.handleJump();
                    }
                });

                btnSmash.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    initSound();
                    if (this.state === PLAYING) {
                        this.handleGroundSmash();
                    }
                });

                // Also init sound on any click/touch
                canvas.addEventListener('click', initSound);
                canvas.addEventListener('touchstart', initSound);
            }

            handlePunch() {
                const currentTime = performance.now();
                if (this.player.punch(currentTime)) {
                    soundManager.playPunch();

                    // Small screen shake for punch
                    this.screenEffects.shake(3, 0.1);

                    // Check for zombie hits
                    const punchBox = this.player.getPunchHitbox();
                    let hitCount = 0;
                    this.zombies.forEach(zombie => {
                        if (!zombie.dead && this.checkCollision(punchBox, zombie.getHitbox())) {
                            // 10% chance to knock back on punch
                            const punchKnockback = Math.random() < 0.10 ? 50 : 0;
                            const result = zombie.takeDamage(PUNCH_DAMAGE, punchKnockback);
                            soundManager.playHit(0.8 + Math.random() * 0.4);
                            if (result.died) {
                                const scoreMultiplier = zombie.type === ZOMBIE_TYPE.TITAN ? 10 :
                                                       zombie.type === ZOMBIE_TYPE.LARGE ? 3 : 1;
                                this.score += KILL_SCORE * scoreMultiplier;
                                this.highScore = Math.max(this.highScore, this.score);

                                // Clear Titan reference if killed
                                if (zombie.type === ZOMBIE_TYPE.TITAN) {
                                    this.activeTitan = null;
                                    this.screenEffects.shake(20, 0.5);
                                    this.screenEffects.flash('rgba(255, 0, 255, 0.5)', 0.5);
                                }
                                this.screenEffects.hitstop(0.05);
                                this.screenEffects.shake(6, 0.15);
                                soundManager.playZombieDeath();

                                // Check for radioactive death - slow player if nearby
                                if (result.isRadioactive) {
                                    const zombieCenter = zombie.getCenter();
                                    const playerCenter = {
                                        x: this.player.x + this.player.width / 2,
                                        y: this.player.y + this.player.height / 2
                                    };
                                    const dist = Math.sqrt(
                                        Math.pow(zombieCenter.x - playerCenter.x, 2) +
                                        Math.pow(zombieCenter.y - playerCenter.y, 2)
                                    );
                                    if (dist <= zombie.radioactiveRadius) {
                                        this.playerSlowedUntil = performance.now() + 5000;
                                        this.screenEffects.flash('rgba(50, 255, 50, 0.4)', 0.5);
                                    }
                                    // Radioactive death particles
                                    this.particles.emit(zombie.x + zombie.width / 2, zombie.y + zombie.height / 2, 20, {
                                        angle: Math.PI / 2,
                                        spread: Math.PI * 2,
                                        speed: 150,
                                        colors: ['#50ff50', '#30cc30', '#80ff80'],
                                        size: 10,
                                        life: 1.2,
                                        gravity: 100,
                                        friction: 0.98
                                    });
                                }

                                // Death particles
                                const deathColors = zombie.type === ZOMBIE_TYPE.RADIOACTIVE ?
                                    ['#50ff50', '#30cc30', '#80ff80', '#8b0000'] :
                                    zombie.type === ZOMBIE_TYPE.FAST ?
                                    ['#9ab0c0', '#7090a0', '#c0d0e0', '#8b0000'] :
                                    zombie.type === ZOMBIE_TYPE.TITAN ?
                                    ['#8800ff', '#ff00ff', '#cc00cc', '#4a3a5a'] :
                                    zombie.type === ZOMBIE_TYPE.LARGE ?
                                    ['#5a6a5a', '#3a4a3a', '#7a8a7a', '#8b0000'] :
                                    ['#4a6b4a', '#6b8e6b', '#3d5a3d', '#8b0000'];
                                this.particles.emit(zombie.x + zombie.width / 2, zombie.y + zombie.height / 2, 15 * zombie.scale, {
                                    angle: Math.PI / 2,
                                    spread: Math.PI,
                                    speed: 200,
                                    colors: deathColors,
                                    size: 8 * zombie.scale,
                                    life: 0.8,
                                    gravity: 400,
                                    friction: 0.98
                                });
                            }

                            // Damage number
                            this.damageNumbers.push(new DamageNumber(
                                zombie.x + zombie.width / 2,
                                zombie.y,
                                PUNCH_DAMAGE,
                                '#ffff00'
                            ));

                            // Hit particles
                            this.particles.emit(zombie.x + zombie.width / 2, zombie.y + zombie.height / 2, 5, {
                                angle: 0,
                                spread: Math.PI * 0.5,
                                speed: 150,
                                colors: ['#ffff00', '#ffffff'],
                                size: 6,
                                life: 0.3,
                                gravity: 0,
                                friction: 0.95
                            });

                            this.hitEffects.push({
                                x: zombie.x + zombie.width / 2,
                                y: zombie.y + zombie.height / 2,
                                life: 0.2,
                                type: 'punch'
                            });
                            hitCount++;
                        }
                    });

                    // Extra shake if hit multiple
                    if (hitCount > 1) {
                        this.screenEffects.shake(5, 0.1);
                    }
                }
            }

            handleShoot() {
                const currentTime = performance.now();
                if (this.player.shoot(currentTime)) {
                    soundManager.playShoot();

                    // Recoil and muzzle flash
                    this.player.applyRecoil(8);
                    this.player.triggerMuzzleFlash();

                    // Screen shake
                    this.screenEffects.shake(4, 0.1);
                    this.screenEffects.flash('rgba(255, 200, 0, 0.3)', 0.3);

                    // Muzzle smoke particles
                    this.particles.emit(this.player.x + this.player.width + 10, this.player.y + 22, 8, {
                        angle: 0,
                        spread: Math.PI * 0.3,
                        speed: 80,
                        colors: ['#888888', '#aaaaaa', '#666666'],
                        size: 10,
                        life: 0.4,
                        gravity: -50,
                        friction: 0.95
                    });

                    // Shell casing particle
                    this.particles.emit(this.player.x + this.player.width - 5, this.player.y + 25, 1, {
                        angle: -Math.PI / 4,
                        spread: 0.3,
                        speed: 150,
                        colors: ['#ffd700'],
                        size: 4,
                        life: 0.6,
                        gravity: 600,
                        friction: 0.99
                    });

                    const direction = this.player.facingRight ? 1 : -1;
                    const bulletX = this.player.facingRight ?
                        this.player.x + this.player.width :
                        this.player.x;
                    this.projectiles.push(new Projectile(bulletX, this.player.y + 22, direction));
                }
            }

            handleJump() {
                if (this.player.jump()) {
                    soundManager.playJump();

                    // Jump dust
                    this.particles.emit(this.player.x + this.player.width / 2, this.player.groundY + this.player.height, 6, {
                        angle: -Math.PI / 2,
                        spread: Math.PI * 0.5,
                        speed: 60,
                        colors: ['#8B7355', '#a08060'],
                        size: 5,
                        life: 0.3,
                        gravity: 150,
                        friction: 0.95
                    });
                }
            }

            handleGroundSmash() {
                const currentTime = performance.now();
                if (this.player.groundSmash(currentTime)) {
                    this.pendingGroundSmash = true;
                }
            }

            applyGroundSmashDamage() {
                soundManager.playGroundSmash();
                this.player.triggerSmashEffect();

                // Big screen shake
                this.screenEffects.shake(15, 0.3);
                this.screenEffects.flash('rgba(255, 100, 0, 0.4)', 0.5);
                this.screenEffects.hitstop(0.08);

                // Player landing squash
                this.player.squashX = 1.5;
                this.player.squashY = 0.5;

                // Ground dust particles
                const smashCenter = this.player.getSmashCenter();
                this.particles.emit(smashCenter.x, smashCenter.y, 25, {
                    angle: -Math.PI / 2,
                    spread: Math.PI * 0.8,
                    speed: 250,
                    colors: ['#8B7355', '#a08060', '#6b5535'],
                    size: 12,
                    life: 0.8,
                    gravity: 300,
                    friction: 0.96,
                    offsetX: 60
                });

                // Debris particles
                this.particles.emit(smashCenter.x, smashCenter.y, 10, {
                    angle: -Math.PI / 2,
                    spread: Math.PI * 0.5,
                    speed: 350,
                    colors: ['#555555', '#777777', '#444444'],
                    size: 6,
                    life: 1,
                    gravity: 500,
                    friction: 0.98
                });

                // Damage all zombies in radius
                let killCount = 0;
                this.zombies.forEach(zombie => {
                    if (zombie.dead) return;

                    const zombieCenter = {
                        x: zombie.x + zombie.width / 2,
                        y: zombie.y + zombie.height / 2
                    };

                    const dx = zombieCenter.x - smashCenter.x;
                    const dy = zombieCenter.y - smashCenter.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance <= GROUND_SMASH_RADIUS) {
                        // Knockback based on distance
                        const knockbackDir = dx > 0 ? 1 : -1;
                        const knockbackAmount = 40 * (1 - distance / GROUND_SMASH_RADIUS);

                        soundManager.playHit(0.6 + Math.random() * 0.3);
                        const result = zombie.takeDamage(GROUND_SMASH_DAMAGE, knockbackAmount * knockbackDir);
                        if (result.died) {
                            const scoreMultiplier = zombie.type === ZOMBIE_TYPE.TITAN ? 10 :
                                                   zombie.type === ZOMBIE_TYPE.LARGE ? 3 : 1;
                            this.score += KILL_SCORE * scoreMultiplier;
                            this.highScore = Math.max(this.highScore, this.score);
                            killCount++;
                            soundManager.playZombieDeath();

                            // Clear Titan reference if killed
                            if (zombie.type === ZOMBIE_TYPE.TITAN) {
                                this.activeTitan = null;
                                this.screenEffects.shake(20, 0.5);
                                this.screenEffects.flash('rgba(255, 0, 255, 0.5)', 0.5);
                            }

                            // Check for radioactive death - slow player (already in smash radius)
                            if (result.isRadioactive) {
                                this.playerSlowedUntil = performance.now() + 5000;
                                this.screenEffects.flash('rgba(50, 255, 50, 0.4)', 0.5);
                                // Radioactive death particles
                                this.particles.emit(zombieCenter.x, zombieCenter.y, 20, {
                                    angle: Math.PI / 2,
                                    spread: Math.PI * 2,
                                    speed: 150,
                                    colors: ['#50ff50', '#30cc30', '#80ff80'],
                                    size: 10,
                                    life: 1.2,
                                    gravity: 100,
                                    friction: 0.98
                                });
                            }

                            // Death particles - color based on type
                            const deathColors = zombie.type === ZOMBIE_TYPE.RADIOACTIVE ?
                                ['#50ff50', '#30cc30', '#80ff80', '#8b0000'] :
                                zombie.type === ZOMBIE_TYPE.FAST ?
                                ['#9ab0c0', '#7090a0', '#c0d0e0', '#8b0000'] :
                                zombie.type === ZOMBIE_TYPE.TITAN ?
                                ['#8800ff', '#ff00ff', '#cc00cc', '#4a3a5a'] :
                                zombie.type === ZOMBIE_TYPE.LARGE ?
                                ['#5a6a5a', '#3a4a3a', '#7a8a7a', '#8b0000'] :
                                ['#4a6b4a', '#6b8e6b', '#3d5a3d', '#8b0000'];
                            this.particles.emit(zombieCenter.x, zombieCenter.y, 20 * zombie.scale, {
                                angle: dx > 0 ? 0 : Math.PI,
                                spread: Math.PI * 0.8,
                                speed: 300,
                                colors: deathColors,
                                size: 10 * zombie.scale,
                                life: 1,
                                gravity: 400,
                                friction: 0.97
                            });
                        }

                        // Damage number
                        this.damageNumbers.push(new DamageNumber(
                            zombieCenter.x,
                            zombie.y,
                            GROUND_SMASH_DAMAGE,
                            '#ff6600',
                            true
                        ));

                        this.hitEffects.push({
                            x: zombieCenter.x,
                            y: zombieCenter.y,
                            life: 0.3,
                            type: 'smash'
                        });
                    }
                });

                // Extra effects for multi-kills
                if (killCount >= 3) {
                    this.screenEffects.shake(20, 0.4);
                    this.screenEffects.triggerChromatic(3);
                }
            }

            startGame() {
                this.state = PLAYING;
                this.player = new Player();
                this.base = new Base();
                this.zombies = [];
                this.projectiles = [];
                this.score = 0;
                this.spawnInterval = INITIAL_SPAWN_INTERVAL;
                this.lastSpawnTime = performance.now();
                this.hitEffects = [];
                this.pendingGroundSmash = false;
                this.particles.clear();
                this.damageNumbers = [];
                this.screenEffects = new ScreenEffects();
                this.playerSlowedUntil = 0;
                this.lastLargeZombieScore = 0;
                this.titanAnnouncement = false;
                this.titanAnnouncementTime = 0;
                this.activeTitan = null;
                soundManager.playBackgroundMusic();
            }

            checkCollision(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                       rect1.x + rect1.width > rect2.x &&
                       rect1.y < rect2.y + rect2.height &&
                       rect1.y + rect1.height > rect2.y;
            }

            update(currentTime) {
                const deltaTime = (currentTime - this.lastTime) / 1000;
                this.lastTime = currentTime;

                // Always update screen effects and background
                this.screenEffects.update(deltaTime);
                this.background.update(deltaTime);

                if (this.state !== PLAYING) return;

                // Hitstop - pause gameplay briefly
                if (this.screenEffects.isHitstop()) {
                    return;
                }

                // Check if player was in air and just landed with ground smash
                const wasInAir = this.player.y < this.player.groundY;

                // Handle player slowdown from radioactive zombies
                if (currentTime < this.playerSlowedUntil) {
                    this.player.speed = this.playerNormalSpeed / 2;
                } else {
                    this.player.speed = this.playerNormalSpeed;
                }

                // Update player
                this.player.update(deltaTime, this.keys);

                // Landing dust particles and sound
                if (wasInAir && this.player.y >= this.player.groundY && this.player.landSquash > 0) {
                    soundManager.playLand();
                    this.screenEffects.shake(2, 0.08);
                    this.particles.emit(this.player.x + this.player.width / 2, this.player.groundY + this.player.height, 8, {
                        angle: -Math.PI / 2,
                        spread: Math.PI * 0.6,
                        speed: 80,
                        colors: ['#8B7355', '#a08060'],
                        size: 6,
                        life: 0.4,
                        gravity: 200,
                        friction: 0.95
                    });
                }

                // Check for ground smash landing
                if (this.pendingGroundSmash && wasInAir && this.player.y >= this.player.groundY) {
                    this.applyGroundSmashDamage();
                    this.pendingGroundSmash = false;
                }

                // Spawn zombies with different types
                if (currentTime - this.lastSpawnTime >= this.spawnInterval) {
                    // Determine zombie type based on probability
                    // 60% normal, 10% fast, 10% radioactive, 10% jumping, 10% chance nothing (balanced)
                    const roll = Math.random();
                    let zombieType;
                    if (roll < 0.60) {
                        zombieType = ZOMBIE_TYPE.NORMAL;
                    } else if (roll < 0.70) {
                        zombieType = ZOMBIE_TYPE.FAST;
                    } else if (roll < 0.80) {
                        zombieType = ZOMBIE_TYPE.RADIOACTIVE;
                    } else if (roll < 0.90) {
                        zombieType = ZOMBIE_TYPE.JUMPING;
                    } else {
                        zombieType = ZOMBIE_TYPE.NORMAL; // Fill remaining 10% with normal
                    }

                    this.zombies.push(new Zombie(zombieType));
                    this.lastSpawnTime = currentTime;
                    this.spawnInterval = Math.max(MIN_SPAWN_INTERVAL, this.spawnInterval - SPAWN_ACCELERATION);
                }

                // Boss spawn every 100 points
                // 89% Mini Boss only, 10% Titan only, 1% both Mini Boss AND Titan
                if (this.score >= this.lastLargeZombieScore + 100) {
                    this.lastLargeZombieScore = Math.floor(this.score / 100) * 100;
                    const bossRoll = Math.random();

                    if (bossRoll < 0.01) {
                        // 1% chance: BOTH Mini Boss and Titan spawn together!
                        this.zombies.push(new Zombie(ZOMBIE_TYPE.LARGE));
                        this.screenEffects.shake(5, 0.3);
                        this.screenEffects.flash('rgba(100, 50, 0, 0.3)', 0.5);

                        if (!this.activeTitan) {
                            const titan = new Zombie(ZOMBIE_TYPE.TITAN);
                            this.zombies.push(titan);
                            this.activeTitan = titan;
                            this.titanAnnouncement = true;
                            this.titanAnnouncementTime = currentTime;
                            this.screenEffects.shake(15, 1.0);
                            this.screenEffects.flash('rgba(100, 0, 150, 0.5)', 1.0);
                            this.screenEffects.triggerChromatic(5);
                        }
                    } else if (bossRoll < 0.11 && !this.activeTitan) {
                        // 10% chance: Titan instead of Mini Boss
                        const titan = new Zombie(ZOMBIE_TYPE.TITAN);
                        this.zombies.push(titan);
                        this.activeTitan = titan;
                        this.titanAnnouncement = true;
                        this.titanAnnouncementTime = currentTime;
                        this.screenEffects.shake(15, 1.0);
                        this.screenEffects.flash('rgba(100, 0, 150, 0.5)', 1.0);
                        this.screenEffects.triggerChromatic(5);
                    } else {
                        // 89% chance: Just Mini Boss
                        this.zombies.push(new Zombie(ZOMBIE_TYPE.LARGE));
                        this.screenEffects.shake(5, 0.3);
                        this.screenEffects.flash('rgba(100, 50, 0, 0.3)', 0.5);
                    }
                }

                // Update zombies
                this.zombies = this.zombies.filter(zombie => {
                    const result = zombie.update(deltaTime, currentTime, this.base);

                    if (result.remove) return false;

                    // Handle radioactive explosion
                    if (result.radioactiveExplosion) {
                        this.base.takeDamage(50);
                        this.screenEffects.shake(15, 0.4);
                        this.screenEffects.flash('rgba(50, 255, 50, 0.6)', 0.8);
                        this.screenEffects.triggerEdgeFlash('#50ff50');

                        // Big radioactive explosion particles
                        this.particles.emit(zombie.x + zombie.width / 2, zombie.y + zombie.height / 2, 40, {
                            angle: Math.PI / 2,
                            spread: Math.PI * 2,
                            speed: 250,
                            colors: ['#50ff50', '#30cc30', '#80ff80', '#ffff00'],
                            size: 12,
                            life: 1.5,
                            gravity: 200,
                            friction: 0.97
                        });

                        // Check if player is nearby for slowdown
                        const zombieCenter = zombie.getCenter();
                        const playerCenter = {
                            x: this.player.x + this.player.width / 2,
                            y: this.player.y + this.player.height / 2
                        };
                        const dist = Math.sqrt(
                            Math.pow(zombieCenter.x - playerCenter.x, 2) +
                            Math.pow(zombieCenter.y - playerCenter.y, 2)
                        );
                        if (dist <= 150) { // Larger radius for explosion
                            this.playerSlowedUntil = performance.now() + 5000;
                        }

                        if (this.base.health <= 0) {
                            this.state = GAME_OVER;
                            this.screenEffects.shake(20, 0.5);
                            this.screenEffects.flash('rgba(255, 0, 0, 0.5)', 1);
                            soundManager.playGameOver();
                        }
                    }

                    // Apply damage from zombie attacks
                    if (result.damage > 0 && !result.radioactiveExplosion) {
                        this.base.takeDamage(result.damage);
                        this.screenEffects.triggerEdgeFlash('#ff0000');
                        this.screenEffects.shake(3, 0.1);
                        if (this.base.health <= 0) {
                            this.state = GAME_OVER;
                            this.screenEffects.shake(20, 0.5);
                            this.screenEffects.flash('rgba(255, 0, 0, 0.5)', 1);
                            soundManager.playGameOver();
                        }
                    }

                    return true;
                });

                // Update projectiles
                this.projectiles = this.projectiles.filter(projectile => {
                    const offScreen = projectile.update(deltaTime);
                    if (offScreen) return false;

                    // Check collision with zombies
                    const projHitbox = projectile.getHitbox();
                    for (let zombie of this.zombies) {
                        if (!zombie.dead && this.checkCollision(projHitbox, zombie.getHitbox())) {
                            // Shooting always knocks back
                            const result = zombie.takeDamage(projectile.damage, 45);
                            soundManager.playHit(1.2 + Math.random() * 0.3);
                            if (result.died) {
                                const scoreMultiplier = zombie.type === ZOMBIE_TYPE.TITAN ? 10 :
                                                       zombie.type === ZOMBIE_TYPE.LARGE ? 3 : 1;
                                this.score += KILL_SCORE * scoreMultiplier;
                                this.highScore = Math.max(this.highScore, this.score);
                                this.screenEffects.hitstop(0.06);
                                this.screenEffects.shake(8, 0.2);
                                soundManager.playZombieDeath();

                                // Clear Titan reference if killed
                                if (zombie.type === ZOMBIE_TYPE.TITAN) {
                                    this.activeTitan = null;
                                    this.screenEffects.shake(20, 0.5);
                                    this.screenEffects.flash('rgba(255, 0, 255, 0.5)', 0.5);
                                }

                                // Check for radioactive death - slow player if nearby
                                if (result.isRadioactive) {
                                    const zombieCenter = zombie.getCenter();
                                    const playerCenter = {
                                        x: this.player.x + this.player.width / 2,
                                        y: this.player.y + this.player.height / 2
                                    };
                                    const dist = Math.sqrt(
                                        Math.pow(zombieCenter.x - playerCenter.x, 2) +
                                        Math.pow(zombieCenter.y - playerCenter.y, 2)
                                    );
                                    if (dist <= zombie.radioactiveRadius) {
                                        this.playerSlowedUntil = performance.now() + 5000;
                                        this.screenEffects.flash('rgba(50, 255, 50, 0.4)', 0.5);
                                    }
                                    // Radioactive death particles
                                    this.particles.emit(zombie.x + zombie.width / 2, zombie.y + zombie.height / 2, 20, {
                                        angle: Math.PI / 2,
                                        spread: Math.PI * 2,
                                        speed: 150,
                                        colors: ['#50ff50', '#30cc30', '#80ff80'],
                                        size: 10,
                                        life: 1.2,
                                        gravity: 100,
                                        friction: 0.98
                                    });
                                }

                                // Death explosion particles - color based on type
                                const deathColors = zombie.type === ZOMBIE_TYPE.RADIOACTIVE ?
                                    ['#50ff50', '#30cc30', '#80ff80', '#ff0000'] :
                                    zombie.type === ZOMBIE_TYPE.FAST ?
                                    ['#9ab0c0', '#7090a0', '#c0d0e0', '#ff0000'] :
                                    zombie.type === ZOMBIE_TYPE.TITAN ?
                                    ['#8800ff', '#ff00ff', '#cc00cc', '#4a3a5a'] :
                                    zombie.type === ZOMBIE_TYPE.LARGE ?
                                    ['#5a6a5a', '#3a4a3a', '#7a8a7a', '#ff0000'] :
                                    ['#4a6b4a', '#6b8e6b', '#3d5a3d', '#8b0000', '#ff0000'];
                                this.particles.emit(zombie.x + zombie.width / 2, zombie.y + zombie.height / 2, 25 * zombie.scale, {
                                    angle: Math.PI,
                                    spread: Math.PI,
                                    speed: 300,
                                    colors: deathColors,
                                    size: 10 * zombie.scale,
                                    life: 1,
                                    gravity: 400,
                                    friction: 0.97
                                });
                            }

                            // Bullet impact particles
                            this.particles.emit(projectile.x, projectile.y, 12, {
                                angle: Math.PI,
                                spread: Math.PI * 0.6,
                                speed: 200,
                                colors: ['#ff8800', '#ffff00', '#ffffff'],
                                size: 6,
                                life: 0.3,
                                gravity: 100,
                                friction: 0.95
                            });

                            // Damage number
                            this.damageNumbers.push(new DamageNumber(
                                zombie.x + zombie.width / 2,
                                zombie.y,
                                projectile.damage,
                                '#ff8800',
                                true
                            ));

                            this.hitEffects.push({
                                x: projectile.x,
                                y: projectile.y,
                                life: 0.2,
                                type: 'bullet'
                            });
                            return false;
                        }
                    }

                    return true;
                });

                // Update particles
                this.particles.update(deltaTime);

                // Update damage numbers
                this.damageNumbers = this.damageNumbers.filter(dn => !dn.update(deltaTime));

                // Update hit effects
                this.hitEffects = this.hitEffects.filter(effect => {
                    effect.life -= deltaTime;
                    return effect.life > 0;
                });
            }

            draw() {
                ctx.save();

                // Apply camera shake
                this.screenEffects.applyShake(ctx);

                // Draw Terraria-style parallax background
                this.background.draw(ctx, 0);

                if (this.state === SPLASH) {
                    this.drawSplash();
                } else if (this.state === PLAYING) {
                    this.drawGame();
                } else if (this.state === GAME_OVER) {
                    this.drawGame();
                    this.drawGameOver();
                }

                // Draw screen flash
                this.screenEffects.drawFlash(ctx);

                // Draw edge flash
                this.screenEffects.drawEdgeFlash(ctx);

                ctx.restore();
            }

            drawSplash() {
                const p = 4; // Pixel size

                // Terraria-style pixelated zombie silhouettes in background
                for (let i = 0; i < 6; i++) {
                    const x = 480 + i * 55;
                    const y = CANVAS_HEIGHT - 90;
                    const alpha = 0.15 + (i % 2) * 0.1;
                    ctx.globalAlpha = alpha;

                    // Pixelated zombie shape
                    ctx.fillStyle = '#5a8a5a';
                    // Head
                    ctx.fillRect(x + 8, y, p*5, p*4);
                    // Body
                    ctx.fillRect(x + 6, y + 16, p*6, p*5);
                    // Legs
                    ctx.fillRect(x + 8, y + 36, p*2, p*4);
                    ctx.fillRect(x + 16, y + 36, p*2, p*4);
                    // Arms reaching
                    ctx.fillRect(x - 4, y + 18, p*4, p*2);

                    // Glowing eyes
                    ctx.fillStyle = '#ff3300';
                    ctx.fillRect(x + 10, y + 6, p, p);
                    ctx.fillRect(x + 18, y + 6, p, p);
                }
                ctx.globalAlpha = 1;

                // Terraria-style wooden sign/banner for title
                ctx.fillStyle = '#6B4914';
                ctx.fillRect(CANVAS_WIDTH / 2 - 180, 30, 360, 70);
                ctx.fillStyle = '#8B6914';
                ctx.fillRect(CANVAS_WIDTH / 2 - 175, 35, 350, 60);

                // Wood plank details
                ctx.fillStyle = '#5a3a10';
                for (let i = 0; i < 7; i++) {
                    ctx.fillRect(CANVAS_WIDTH / 2 - 170 + i * 50, 35, 2, 60);
                }

                // Banner rope
                ctx.fillStyle = '#4a3a2a';
                ctx.fillRect(CANVAS_WIDTH / 2 - 185, 25, 10, 15);
                ctx.fillRect(CANVAS_WIDTH / 2 + 175, 25, 10, 15);

                // Title shadow (pixelated effect)
                ctx.fillStyle = '#1a0a0a';
                ctx.font = 'bold 52px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('SMASHERS', CANVAS_WIDTH / 2 + 3, 78);

                // Title with gradient effect
                ctx.fillStyle = '#ff4444';
                ctx.fillText('SMASHERS', CANVAS_WIDTH / 2, 75);

                // Title highlight
                ctx.fillStyle = '#ff8888';
                ctx.font = 'bold 52px Courier New';
                ctx.globalAlpha = 0.5;
                ctx.fillText('SMASHERS', CANVAS_WIDTH / 2 - 1, 74);
                ctx.globalAlpha = 1;

                // Subtitle with pixelated underline
                ctx.fillStyle = '#7a9a7a';
                ctx.font = 'bold 18px Courier New';
                ctx.fillText('ZOMBIE DEFENSE', CANVAS_WIDTH / 2, 100);

                // Decorative pixels around subtitle
                ctx.fillStyle = '#5a7a5a';
                ctx.fillRect(CANVAS_WIDTH / 2 - 100, 104, 200, 2);
                for (let i = 0; i < 10; i++) {
                    ctx.fillRect(CANVAS_WIDTH / 2 - 100 + i * 22, 106, p, p);
                }

                // Terraria-style inventory/controls box
                ctx.fillStyle = 'rgba(60, 50, 40, 0.9)';
                ctx.fillRect(CANVAS_WIDTH / 2 - 155, 145, 310, 215);

                // Box border (wooden frame style)
                ctx.fillStyle = '#5a4a3a';
                ctx.fillRect(CANVAS_WIDTH / 2 - 160, 140, 320, 5);
                ctx.fillRect(CANVAS_WIDTH / 2 - 160, 355, 320, 5);
                ctx.fillRect(CANVAS_WIDTH / 2 - 160, 140, 5, 220);
                ctx.fillRect(CANVAS_WIDTH / 2 + 155, 140, 5, 220);

                // Corner decorations
                ctx.fillStyle = '#7a6a5a';
                ctx.fillRect(CANVAS_WIDTH / 2 - 160, 140, 10, 10);
                ctx.fillRect(CANVAS_WIDTH / 2 + 150, 140, 10, 10);
                ctx.fillRect(CANVAS_WIDTH / 2 - 160, 350, 10, 10);
                ctx.fillRect(CANVAS_WIDTH / 2 + 150, 350, 10, 10);

                // Controls header
                ctx.fillStyle = '#ffdd88';
                ctx.font = 'bold 16px Courier New';
                ctx.fillText('~ CONTROLS ~', CANVAS_WIDTH / 2, 168);

                // Controls list with Terraria-style formatting
                ctx.font = '13px Courier New';
                const controls = [
                    { key: 'A/D', action: 'Move Left/Right' },
                    { key: 'SPACE', action: 'Punch (tap)' },
                    { key: 'Q', action: 'Shoot (2.5s cooldown)' },
                    { key: 'W', action: 'Jump' },
                    { key: 'S', action: 'Ground Smash (in air)' },
                    { key: '', action: '50 AOE dmg, 2s cooldown' }
                ];

                controls.forEach((ctrl, i) => {
                    const y = 195 + i * 24;
                    if (ctrl.key) {
                        // Key box
                        ctx.fillStyle = '#4a4a5a';
                        ctx.fillRect(CANVAS_WIDTH / 2 - 130, y - 12, 50, 18);
                        ctx.fillStyle = '#6a6a7a';
                        ctx.fillRect(CANVAS_WIDTH / 2 - 128, y - 10, 46, 14);
                        ctx.fillStyle = '#ffffff';
                        ctx.textAlign = 'center';
                        ctx.fillText(ctrl.key, CANVAS_WIDTH / 2 - 105, y);

                        // Action text
                        ctx.fillStyle = '#cccccc';
                        ctx.textAlign = 'left';
                        ctx.fillText(ctrl.action, CANVAS_WIDTH / 2 - 70, y);
                    } else {
                        ctx.fillStyle = '#888888';
                        ctx.textAlign = 'center';
                        ctx.fillText(ctrl.action, CANVAS_WIDTH / 2, y);
                    }
                });
                ctx.textAlign = 'center';

                // Start prompt with pulsing glow
                const pulse = Math.sin(performance.now() / 300) * 0.3 + 0.7;
                const glowPulse = Math.sin(performance.now() / 200) * 10 + 10;

                // Glow behind text
                ctx.fillStyle = `rgba(100, 200, 100, ${pulse * 0.3})`;
                ctx.fillRect(CANVAS_WIDTH / 2 - 120, 368, 240, 24);

                ctx.fillStyle = `rgb(100, ${Math.floor(200 * pulse + 55)}, 100)`;
                ctx.font = 'bold 18px Courier New';
                ctx.globalAlpha = pulse;
                ctx.fillText('[ Press SPACE to Start ]', CANVAS_WIDTH / 2, 385);
                ctx.globalAlpha = 1;

                // Decorative swords/weapons on sides
                ctx.fillStyle = '#aaaaaa';
                // Left sword
                ctx.fillRect(70, 200, 4, 80);
                ctx.fillStyle = '#888888';
                ctx.fillRect(60, 195, 24, 8);
                ctx.fillStyle = '#6a5a4a';
                ctx.fillRect(65, 280, 14, 20);

                // Right sword
                ctx.fillStyle = '#aaaaaa';
                ctx.fillRect(726, 200, 4, 80);
                ctx.fillStyle = '#888888';
                ctx.fillRect(716, 195, 24, 8);
                ctx.fillStyle = '#6a5a4a';
                ctx.fillRect(721, 280, 14, 20);
            }

            drawGame() {
                // Draw base
                this.base.draw();

                // Draw particles (behind entities)
                this.particles.draw(ctx);

                // Draw zombies
                this.zombies.forEach(zombie => zombie.draw());

                // Draw player
                this.player.draw();

                // Draw projectiles
                this.projectiles.forEach(proj => proj.draw());

                // Draw hit effects
                this.hitEffects.forEach(effect => {
                    ctx.globalAlpha = effect.life * 5;
                    if (effect.type === 'punch') {
                        ctx.fillStyle = '#ffff00';
                        // Add starburst
                        ctx.strokeStyle = '#ffff00';
                        ctx.lineWidth = 2;
                        for (let i = 0; i < 6; i++) {
                            const angle = (i / 6) * Math.PI * 2;
                            const len = 15 * (1 - effect.life);
                            ctx.beginPath();
                            ctx.moveTo(effect.x, effect.y);
                            ctx.lineTo(effect.x + Math.cos(angle) * len, effect.y + Math.sin(angle) * len);
                            ctx.stroke();
                        }
                    } else if (effect.type === 'smash') {
                        ctx.fillStyle = '#ff6600';
                    } else {
                        ctx.fillStyle = '#ff8800';
                    }
                    ctx.beginPath();
                    const radius = effect.type === 'smash' ? 25 * (1 - effect.life) : 15 * (1 - effect.life * 2);
                    ctx.arc(effect.x, effect.y, Math.max(0, radius), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });

                // Draw damage numbers
                this.damageNumbers.forEach(dn => dn.draw(ctx));

                // Draw HUD
                this.drawHUD();
            }

            drawHUD() {
                // Base health bar
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(10, 10, 160, 50);

                ctx.fillStyle = '#fff';
                ctx.font = '14px Courier New';
                ctx.textAlign = 'left';
                ctx.fillText('BASE HEALTH', 20, 28);

                // Health bar background
                ctx.fillStyle = '#333';
                ctx.fillRect(20, 35, 140, 15);

                // Health bar fill
                const healthPercent = this.base.health / this.base.maxHealth;
                ctx.fillStyle = healthPercent > 0.5 ? '#4CAF50' : healthPercent > 0.25 ? '#FF9800' : '#f44336';
                ctx.fillRect(20, 35, 140 * healthPercent, 15);

                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1;
                ctx.strokeRect(20, 35, 140, 15);

                // Score
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(CANVAS_WIDTH - 130, 10, 120, 50);

                ctx.fillStyle = '#FFD700';
                ctx.font = '14px Courier New';
                ctx.textAlign = 'right';
                ctx.fillText('SCORE', CANVAS_WIDTH - 20, 28);
                ctx.font = 'bold 20px Courier New';
                ctx.fillText(this.score.toString(), CANVAS_WIDTH - 20, 50);

                // Cooldown indicators
                const currentTime = performance.now();
                const shootCooldownLeft = Math.max(0, SHOOT_COOLDOWN - (currentTime - this.player.lastShootTime));
                const smashCooldownLeft = Math.max(0, GROUND_SMASH_COOLDOWN - (currentTime - this.player.lastGroundSmashTime));

                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(CANVAS_WIDTH / 2 - 80, 10, 160, 35);

                ctx.textAlign = 'center';
                ctx.font = '11px Courier New';

                // Shoot cooldown
                ctx.fillStyle = shootCooldownLeft > 0 ? '#666' : '#4CAF50';
                ctx.fillText('SHOOT [Q]', CANVAS_WIDTH / 2 - 40, 25);
                if (shootCooldownLeft > 0) {
                    ctx.fillStyle = '#ff6666';
                    ctx.fillText((shootCooldownLeft / 1000).toFixed(1) + 's', CANVAS_WIDTH / 2 - 40, 40);
                } else {
                    ctx.fillStyle = '#4CAF50';
                    ctx.fillText('READY', CANVAS_WIDTH / 2 - 40, 40);
                }

                // Smash cooldown
                ctx.fillStyle = smashCooldownLeft > 0 ? '#666' : '#4CAF50';
                ctx.fillText('SMASH [W+S]', CANVAS_WIDTH / 2 + 40, 25);
                if (smashCooldownLeft > 0) {
                    ctx.fillStyle = '#ff6666';
                    ctx.fillText((smashCooldownLeft / 1000).toFixed(1) + 's', CANVAS_WIDTH / 2 + 40, 40);
                } else {
                    ctx.fillStyle = '#4CAF50';
                    ctx.fillText('READY', CANVAS_WIDTH / 2 + 40, 40);
                }

                // Titan Health Bar (at top of screen when active)
                if (this.activeTitan && !this.activeTitan.dead) {
                    const titanBarWidth = 300;
                    const titanBarHeight = 20;
                    const titanBarX = (CANVAS_WIDTH - titanBarWidth) / 2;
                    const titanBarY = 55;

                    // Background panel
                    ctx.fillStyle = 'rgba(50, 0, 80, 0.9)';
                    ctx.fillRect(titanBarX - 10, titanBarY - 5, titanBarWidth + 20, titanBarHeight + 25);

                    // Pulsing border
                    const pulse = Math.sin(currentTime / 200) * 0.3 + 0.7;
                    ctx.strokeStyle = `rgba(255, 0, 255, ${pulse})`;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(titanBarX - 10, titanBarY - 5, titanBarWidth + 20, titanBarHeight + 25);

                    // Label
                    ctx.fillStyle = '#ff00ff';
                    ctx.font = 'bold 12px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText('THE TITAN', CANVAS_WIDTH / 2, titanBarY + 8);

                    // Health bar background
                    ctx.fillStyle = '#1a1a2a';
                    ctx.fillRect(titanBarX, titanBarY + 12, titanBarWidth, titanBarHeight);

                    // Health bar fill (purple gradient effect)
                    const titanHealthPercent = this.activeTitan.health / this.activeTitan.maxHealth;
                    const gradient = ctx.createLinearGradient(titanBarX, 0, titanBarX + titanBarWidth * titanHealthPercent, 0);
                    gradient.addColorStop(0, '#8800ff');
                    gradient.addColorStop(0.5, '#ff00ff');
                    gradient.addColorStop(1, '#cc00cc');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(titanBarX, titanBarY + 12, titanBarWidth * titanHealthPercent, titanBarHeight);

                    // Health bar border
                    ctx.strokeStyle = '#ff00ff';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(titanBarX, titanBarY + 12, titanBarWidth, titanBarHeight);

                    // Health text
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 11px Courier New';
                    ctx.fillText(`${Math.ceil(this.activeTitan.health)} / ${this.activeTitan.maxHealth}`, CANVAS_WIDTH / 2, titanBarY + 27);
                }

                // Titan Announcement (shows for 3 seconds when Titan spawns)
                if (this.titanAnnouncement) {
                    const announcementDuration = 3000;
                    const timeSinceAnnouncement = currentTime - this.titanAnnouncementTime;

                    if (timeSinceAnnouncement < announcementDuration) {
                        const fadeIn = Math.min(1, timeSinceAnnouncement / 300);
                        const fadeOut = Math.max(0, 1 - (timeSinceAnnouncement - announcementDuration + 500) / 500);
                        const alpha = Math.min(fadeIn, fadeOut);

                        // Dark overlay behind text
                        ctx.fillStyle = `rgba(50, 0, 80, ${alpha * 0.7})`;
                        ctx.fillRect(0, CANVAS_HEIGHT / 2 - 50, CANVAS_WIDTH, 100);

                        // Glowing text effect
                        ctx.textAlign = 'center';
                        ctx.font = 'bold 36px Courier New';

                        // Shadow/glow
                        ctx.shadowColor = '#ff00ff';
                        ctx.shadowBlur = 20 + Math.sin(currentTime / 100) * 10;
                        ctx.fillStyle = `rgba(255, 0, 255, ${alpha})`;
                        ctx.fillText('THE TITAN HAS AWAKENED', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);

                        // Main text
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                        ctx.fillText('THE TITAN HAS AWAKENED', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);

                        // Subtitle
                        ctx.font = '18px Courier New';
                        ctx.fillStyle = `rgba(200, 100, 255, ${alpha})`;
                        ctx.fillText('500 HP MEGA BOSS', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 30);

                        ctx.shadowColor = 'transparent';
                    } else {
                        this.titanAnnouncement = false;
                    }
                }
            }

            drawGameOver() {
                // Dark overlay with red tint (blood moon style)
                ctx.fillStyle = 'rgba(20, 0, 0, 0.85)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                // Animated blood drip effect at top
                ctx.fillStyle = '#660000';
                for (let i = 0; i < 20; i++) {
                    const dripHeight = 20 + Math.sin(performance.now() / 500 + i) * 10;
                    ctx.fillRect(i * 42, 0, 40, dripHeight);
                    ctx.fillRect(i * 42 + 10, dripHeight, 20, 10);
                }

                ctx.textAlign = 'center';

                // Terraria-style tombstone
                ctx.fillStyle = '#5a5a5a';
                ctx.fillRect(CANVAS_WIDTH / 2 - 80, 60, 160, 200);
                ctx.fillStyle = '#4a4a4a';
                ctx.fillRect(CANVAS_WIDTH / 2 - 70, 70, 140, 180);

                // Tombstone top curve (pixelated)
                ctx.fillStyle = '#5a5a5a';
                ctx.fillRect(CANVAS_WIDTH / 2 - 60, 50, 120, 15);
                ctx.fillRect(CANVAS_WIDTH / 2 - 40, 40, 80, 15);
                ctx.fillRect(CANVAS_WIDTH / 2 - 20, 35, 40, 10);

                // Cracks in stone
                ctx.fillStyle = '#3a3a3a';
                ctx.fillRect(CANVAS_WIDTH / 2 - 30, 80, 3, 40);
                ctx.fillRect(CANVAS_WIDTH / 2 - 27, 100, 20, 2);
                ctx.fillRect(CANVAS_WIDTH / 2 + 20, 120, 2, 50);
                ctx.fillRect(CANVAS_WIDTH / 2 + 15, 140, 15, 2);

                // Game Over text on tombstone
                ctx.fillStyle = '#aa2222';
                ctx.font = 'bold 36px Courier New';
                ctx.fillText('GAME', CANVAS_WIDTH / 2, 110);
                ctx.fillText('OVER', CANVAS_WIDTH / 2, 150);

                // Skull decoration
                ctx.fillStyle = '#cccccc';
                ctx.fillRect(CANVAS_WIDTH / 2 - 15, 170, 30, 25);
                ctx.fillRect(CANVAS_WIDTH / 2 - 10, 195, 20, 15);
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(CANVAS_WIDTH / 2 - 10, 175, 6, 8);
                ctx.fillRect(CANVAS_WIDTH / 2 + 4, 175, 6, 8);
                ctx.fillRect(CANVAS_WIDTH / 2 - 5, 198, 3, 5);
                ctx.fillRect(CANVAS_WIDTH / 2 - 1, 198, 3, 5);
                ctx.fillRect(CANVAS_WIDTH / 2 + 3, 198, 3, 5);

                // Score display (Terraria inventory style)
                ctx.fillStyle = 'rgba(60, 50, 40, 0.9)';
                ctx.fillRect(CANVAS_WIDTH / 2 - 120, 270, 240, 80);
                ctx.fillStyle = '#5a4a3a';
                ctx.fillRect(CANVAS_WIDTH / 2 - 125, 265, 250, 5);
                ctx.fillRect(CANVAS_WIDTH / 2 - 125, 345, 250, 5);
                ctx.fillRect(CANVAS_WIDTH / 2 - 125, 265, 5, 85);
                ctx.fillRect(CANVAS_WIDTH / 2 + 120, 265, 5, 85);

                // Final score with coin icon
                ctx.fillStyle = '#ffdd44';
                ctx.fillRect(CANVAS_WIDTH / 2 - 100, 285, 16, 16);
                ctx.fillStyle = '#ccaa22';
                ctx.fillRect(CANVAS_WIDTH / 2 - 98, 287, 12, 12);
                ctx.fillStyle = '#ffee88';
                ctx.fillRect(CANVAS_WIDTH / 2 - 96, 289, 4, 4);

                ctx.fillStyle = '#ffffff';
                ctx.font = '20px Courier New';
                ctx.textAlign = 'left';
                ctx.fillText('Score: ' + this.score, CANVAS_WIDTH / 2 - 75, 298);

                // High score with trophy icon
                ctx.fillStyle = '#ffaa00';
                ctx.fillRect(CANVAS_WIDTH / 2 - 100, 315, 16, 12);
                ctx.fillRect(CANVAS_WIDTH / 2 - 96, 327, 8, 6);
                ctx.fillRect(CANVAS_WIDTH / 2 - 98, 333, 12, 4);
                ctx.fillStyle = '#cc8800';
                ctx.fillRect(CANVAS_WIDTH / 2 - 104, 317, 4, 6);
                ctx.fillRect(CANVAS_WIDTH / 2 - 84, 317, 4, 6);

                ctx.fillStyle = '#FFD700';
                ctx.fillText('Best:  ' + this.highScore, CANVAS_WIDTH / 2 - 75, 328);

                ctx.textAlign = 'center';

                // Restart prompt
                const pulse = Math.sin(performance.now() / 300) * 0.3 + 0.7;
                ctx.fillStyle = `rgba(100, 200, 100, ${pulse * 0.3})`;
                ctx.fillRect(CANVAS_WIDTH / 2 - 130, 360, 260, 28);

                ctx.fillStyle = `rgb(100, ${Math.floor(200 * pulse + 55)}, 100)`;
                ctx.font = 'bold 18px Courier New';
                ctx.globalAlpha = pulse;
                ctx.fillText('[ Press SPACE to Restart ]', CANVAS_WIDTH / 2, 380);
                ctx.globalAlpha = 1;
            }

            gameLoop(currentTime) {
                this.update(currentTime);
                this.draw();
                requestAnimationFrame((time) => this.gameLoop(time));
            }

            start() {
                this.lastTime = performance.now();
                requestAnimationFrame((time) => this.gameLoop(time));
            }
        }

        // ============================================
        // START GAME
        // ============================================
        const game = new Game();
        game.start();
    </script>
</body>
</html>
