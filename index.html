                            life: 1.5,
                            gravity: 200,
                            friction: 0.97
                        });

                        // Check if player is nearby for slowdown
                        const zombieCenter = zombie.getCenter();
                        const playerCenter = {
                            x: this.player.x + this.player.width / 2,
                            y: this.player.y + this.player.height / 2
                        };
                        const dist = Math.sqrt(
                            Math.pow(zombieCenter.x - playerCenter.x, 2) +
                            Math.pow(zombieCenter.y - playerCenter.y, 2)
                        );
                        if (dist <= 150) { // Larger radius for explosion
                            this.playerSlowedUntil = performance.now() + 5000;
                        }

                        if (this.base.health <= 0) {
                            this.state = GAME_OVER;
                            this.screenEffects.shake(20, 0.5);
                            this.screenEffects.flash('rgba(255, 0, 0, 0.5)', 1);
                            soundManager.playGameOver();
                        }
                    }

                    // Apply damage from zombie attacks
                    if (result.damage > 0 && !result.radioactiveExplosion) {
                        this.base.takeDamage(result.damage);
                        this.screenEffects.triggerEdgeFlash('#ff0000');
                        this.screenEffects.shake(3, 0.1);
                        if (this.base.health <= 0) {
                            this.state = GAME_OVER;
                            this.screenEffects.shake(20, 0.5);
                            this.screenEffects.flash('rgba(255, 0, 0, 0.5)', 1);
                            soundManager.playGameOver();
                        }
                    }

                    return true;
                });

                // Update projectiles
                this.projectiles = this.projectiles.filter(projectile => {
                    const offScreen = projectile.update(deltaTime);
                    if (offScreen) return false;

                    // Check collision with zombies
                    const projHitbox = projectile.getHitbox();
                    for (let zombie of this.zombies) {
                        if (!zombie.dead && this.checkCollision(projHitbox, zombie.getHitbox())) {
                            // Shooting knocks back (but not minigun)
                            const knockback = projectile.isMinigun ? 0 : 45;
                            const result = zombie.takeDamage(projectile.damage, knockback);
                            soundManager.playHit(1.2 + Math.random() * 0.3);
                            if (result.died) {
                                const scoreMultiplier = zombie.type === ZOMBIE_TYPE.TITAN ? 10 :
                                                       zombie.type === ZOMBIE_TYPE.LARGE ? 3 : 1;
                                this.score += KILL_SCORE * scoreMultiplier;
                                this.highScore = Math.max(this.highScore, this.score);
                                this.screenEffects.hitstop(0.06);
                                this.screenEffects.shake(8, 0.2);
                                soundManager.playZombieDeath();

                                // Clear Titan reference if killed
                                if (zombie.type === ZOMBIE_TYPE.TITAN) {
                                    this.activeTitan = null;
                                    this.screenEffects.shake(20, 0.5);
                                    this.screenEffects.flash('rgba(255, 0, 255, 0.5)', 0.5);
                                }

                                // Check for radioactive death - slow player if nearby
                                if (result.isRadioactive) {
                                    const zombieCenter = zombie.getCenter();
                                    const playerCenter = {
                                        x: this.player.x + this.player.width / 2,
                                        y: this.player.y + this.player.height / 2
                                    };
                                    const dist = Math.sqrt(
                                        Math.pow(zombieCenter.x - playerCenter.x, 2) +
                                        Math.pow(zombieCenter.y - playerCenter.y, 2)
                                    );
                                    if (dist <= zombie.radioactiveRadius) {
                                        this.playerSlowedUntil = performance.now() + 5000;
                                        this.screenEffects.flash('rgba(50, 255, 50, 0.4)', 0.5);
                                    }
                                    // Radioactive death particles
                                    this.particles.emit(zombie.x + zombie.width / 2, zombie.y + zombie.height / 2, 20, {
                                        angle: Math.PI / 2,
                                        spread: Math.PI * 2,
                                        speed: 150,
                                        colors: ['#50ff50', '#30cc30', '#80ff80'],
                                        size: 10,
                                        life: 1.2,
                                        gravity: 100,
                                        friction: 0.98
                                    });
                                }

                                // Death explosion particles - color based on type
                                const deathColors = zombie.type === ZOMBIE_TYPE.RADIOACTIVE ?
                                    ['#50ff50', '#30cc30', '#80ff80', '#ff0000'] :
                                    zombie.type === ZOMBIE_TYPE.FAST ?
                                    ['#9ab0c0', '#7090a0', '#c0d0e0', '#ff0000'] :
                                    zombie.type === ZOMBIE_TYPE.TITAN ?
                                    ['#8800ff', '#ff00ff', '#cc00cc', '#4a3a5a'] :
                                    zombie.type === ZOMBIE_TYPE.LARGE ?
                                    ['#5a6a5a', '#3a4a3a', '#7a8a7a', '#ff0000'] :
                                    ['#4a6b4a', '#6b8e6b', '#3d5a3d', '#8b0000', '#ff0000'];
                                this.particles.emit(zombie.x + zombie.width / 2, zombie.y + zombie.height / 2, 25 * zombie.scale, {
                                    angle: Math.PI,
                                    spread: Math.PI,
                                    speed: 300,
                                    colors: deathColors,
                                    size: 10 * zombie.scale,
                                    life: 1,
                                    gravity: 400,
                                    friction: 0.97
                                });
                            }

                            // Bullet impact particles
                            this.particles.emit(projectile.x, projectile.y, 12, {
                                angle: Math.PI,
                                spread: Math.PI * 0.6,
                                speed: 200,
                                colors: ['#ff8800', '#ffff00', '#ffffff'],
                                size: 6,
                                life: 0.3,
                                gravity: 100,
                                friction: 0.95
                            });

                            // Damage number
                            this.damageNumbers.push(new DamageNumber(
                                zombie.x + zombie.width / 2,
                                zombie.y,
                                projectile.damage,
                                '#ff8800',
                                true
                            ));

                            this.hitEffects.push({
                                x: projectile.x,
                                y: projectile.y,
                                life: 0.2,
                                type: 'bullet'
                            });
                            return false;
                        }
                    }

                    return true;
                });

                // Update shell casings
                this.shellCasings = this.shellCasings.filter(shell => !shell.update(deltaTime));

                // Update particles
                this.particles.update(deltaTime);

                // Update damage numbers
                this.damageNumbers = this.damageNumbers.filter(dn => !dn.update(deltaTime));

                // Update hit effects
                this.hitEffects = this.hitEffects.filter(effect => {
                    effect.life -= deltaTime;
                    return effect.life > 0;
                });
            }

            draw() {
                ctx.save();

                // Apply camera shake
                this.screenEffects.applyShake(ctx);

                // Draw Terraria-style parallax background
                this.background.draw(ctx, 0);

                if (this.state === SPLASH) {
                    this.drawSplash();
                } else if (this.state === PLAYING) {
                    this.drawGame();
                } else if (this.state === GAME_OVER) {
                    this.drawGame();
                    this.drawGameOver();
                }

                // Draw screen flash
                this.screenEffects.drawFlash(ctx);

                // Draw edge flash
                this.screenEffects.drawEdgeFlash(ctx);

                ctx.restore();
            }

            drawGame() {
                // Draw base
                this.base.draw();

                // Draw particles (behind entities)
                this.particles.draw(ctx);

                // Draw zombies
                this.zombies.forEach(zombie => zombie.draw());

                // Draw player
                this.player.draw();

                // Draw projectiles
                this.projectiles.forEach(proj => proj.draw());

                // Draw shell casings
                this.shellCasings.forEach(shell => shell.draw());

                // Draw hit effects
                this.hitEffects.forEach(effect => {
                    ctx.globalAlpha = effect.life * 5;
                    if (effect.type === 'punch') {
                        ctx.fillStyle = '#ffff00';
                        // Add starburst
                        ctx.strokeStyle = '#ffff00';
                        ctx.lineWidth = 2;
                        for (let i = 0; i < 6; i++) {
                            const angle = (i / 6) * Math.PI * 2;
                            const len = 15 * (1 - effect.life);
                            ctx.beginPath();
                            ctx.moveTo(effect.x, effect.y);
                            ctx.lineTo(effect.x + Math.cos(angle) * len, effect.y + Math.sin(angle) * len);
                            ctx.stroke();
                        }
                    } else if (effect.type === 'smash') {
                        ctx.fillStyle = '#ff6600';
                    } else {
                        ctx.fillStyle = '#ff8800';
                    }
                    ctx.beginPath();
                    const radius = effect.type === 'smash' ? 25 * (1 - effect.life) : 15 * (1 - effect.life * 2);
                    ctx.arc(effect.x, effect.y, Math.max(0, radius), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });

                // Draw damage numbers
                this.damageNumbers.forEach(dn => dn.draw(ctx));

                // Draw HUD
                this.drawHUD();
            }

            drawHUD() {
                // Base health bar
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(10, 10, 160, 50);

                ctx.fillStyle = '#fff';
                ctx.font = '14px Courier New';
                ctx.textAlign = 'left';
                ctx.fillText('BASE HEALTH', 20, 28);

                // Health bar background
                ctx.fillStyle = '#333';
                ctx.fillRect(20, 35, 140, 15);

                // Health bar fill
                const healthPercent = this.base.health / this.base.maxHealth;
                ctx.fillStyle = healthPercent > 0.5 ? '#4CAF50' : healthPercent > 0.25 ? '#FF9800' : '#f44336';
                ctx.fillRect(20, 35, 140 * healthPercent, 15);

                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1;
                ctx.strokeRect(20, 35, 140, 15);

                // Score
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(CANVAS_WIDTH - 130, 10, 120, 50);

                ctx.fillStyle = '#FFD700';
                ctx.font = '14px Courier New';
                ctx.textAlign = 'right';
                ctx.fillText('SCORE', CANVAS_WIDTH - 20, 28);
                ctx.font = 'bold 20px Courier New';
                ctx.fillText(this.score.toString(), CANVAS_WIDTH - 20, 50);

                // Cooldown indicators
                const currentTime = performance.now();
                const shootCooldownLeft = this.hasMinigun ? 0 : Math.max(0, SHOOT_COOLDOWN - (currentTime - this.player.lastShootTime));
                const smashCooldownLeft = Math.max(0, GROUND_SMASH_COOLDOWN - (currentTime - this.player.lastGroundSmashTime));

                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(CANVAS_WIDTH / 2 - 80, 10, 160, 35);

                ctx.textAlign = 'center';
                ctx.font = '11px Courier New';

                // Shoot/Minigun cooldown
                if (this.hasMinigun) {
                    // Minigun is always ready (near-instant cooldown)
                    ctx.fillStyle = '#ff8800';
                    ctx.fillText('MINIGUN [Q]', CANVAS_WIDTH / 2 - 40, 25);
                    ctx.fillStyle = '#ff8800';
                    ctx.fillText('HOLD!', CANVAS_WIDTH / 2 - 40, 40);
                } else {
                    ctx.fillStyle = shootCooldownLeft > 0 ? '#666' : '#4CAF50';
                    ctx.fillText('SHOOT [Q]', CANVAS_WIDTH / 2 - 40, 25);
                    if (shootCooldownLeft > 0) {
                        ctx.fillStyle = '#ff6666';
                        ctx.fillText((shootCooldownLeft / 1000).toFixed(1) + 's', CANVAS_WIDTH / 2 - 40, 40);
                    } else {
                        ctx.fillStyle = '#4CAF50';
                        ctx.fillText('READY', CANVAS_WIDTH / 2 - 40, 40);
                    }
                }

                // Smash cooldown
                ctx.fillStyle = smashCooldownLeft > 0 ? '#666' : '#4CAF50';
                ctx.fillText('SMASH [W+S]', CANVAS_WIDTH / 2 + 40, 25);
                if (smashCooldownLeft > 0) {
                    ctx.fillStyle = '#ff6666';
                    ctx.fillText((smashCooldownLeft / 1000).toFixed(1) + 's', CANVAS_WIDTH / 2 + 40, 40);
                } else {
                    ctx.fillStyle = '#4CAF50';
                    ctx.fillText('READY', CANVAS_WIDTH / 2 + 40, 40);
                }

                // Titan Health Bar (at top of screen when active)
                if (this.activeTitan && !this.activeTitan.dead) {
                    const titanBarWidth = 300;
                    const titanBarHeight = 20;
                    const titanBarX = (CANVAS_WIDTH - titanBarWidth) / 2;
                    const titanBarY = 55;

                    // Background panel
                    ctx.fillStyle = 'rgba(50, 0, 80, 0.9)';
                    ctx.fillRect(titanBarX - 10, titanBarY - 5, titanBarWidth + 20, titanBarHeight + 25);

                    // Pulsing border
                    const pulse = Math.sin(currentTime / 200) * 0.3 + 0.7;
                    ctx.strokeStyle = `rgba(255, 0, 255, ${pulse})`;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(titanBarX - 10, titanBarY - 5, titanBarWidth + 20, titanBarHeight + 25);

                    // Label
                    ctx.fillStyle = '#ff00ff';
                    ctx.font = 'bold 12px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText('THE TITAN', CANVAS_WIDTH / 2, titanBarY + 8);

                    // Health bar background
                    ctx.fillStyle = '#1a1a2a';
                    ctx.fillRect(titanBarX, titanBarY + 12, titanBarWidth, titanBarHeight);

                    // Health bar fill (purple gradient effect)
                    const titanHealthPercent = this.activeTitan.health / this.activeTitan.maxHealth;
                    const gradient = ctx.createLinearGradient(titanBarX, 0, titanBarX + titanBarWidth * titanHealthPercent, 0);
                    gradient.addColorStop(0, '#8800ff');
                    gradient.addColorStop(0.5, '#ff00ff');
                    gradient.addColorStop(1, '#cc00cc');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(titanBarX, titanBarY + 12, titanBarWidth * titanHealthPercent, titanBarHeight);

                    // Health bar border
                    ctx.strokeStyle = '#ff00ff';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(titanBarX, titanBarY + 12, titanBarWidth, titanBarHeight);

                    // Health text
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 11px Courier New';
                    ctx.fillText(`${Math.ceil(this.activeTitan.health)} / ${this.activeTitan.maxHealth}`, CANVAS_WIDTH / 2, titanBarY + 27);
                }

                // Titan Announcement (shows for 3 seconds when Titan spawns)
                if (this.titanAnnouncement) {
                    const announcementDuration = 3000;
                    const timeSinceAnnouncement = currentTime - this.titanAnnouncementTime;

                    if (timeSinceAnnouncement < announcementDuration) {
                        const fadeIn = Math.min(1, timeSinceAnnouncement / 300);
                        const fadeOut = Math.max(0, 1 - (timeSinceAnnouncement - announcementDuration + 500) / 500);
                        const alpha = Math.min(fadeIn, fadeOut);

                        // Dark overlay behind text
                        ctx.fillStyle = `rgba(50, 0, 80, ${alpha * 0.7})`;
                        ctx.fillRect(0, CANVAS_HEIGHT / 2 - 50, CANVAS_WIDTH, 100);

                        // Glowing text effect
                        ctx.textAlign = 'center';
                        ctx.font = 'bold 36px Courier New';

                        ctx.fillText('THE TITAN HAS AWAKENED', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);

                        // Main text
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                        ctx.fillText('THE TITAN HAS AWAKENED', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);

                        // Subtitle
                        ctx.font = '18px Courier New';
                        ctx.fillStyle = `rgba(200, 100, 255, ${alpha})`;
                        ctx.fillText('500 HP MEGA BOSS', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 30);

                        ctx.shadowColor = 'transparent';
                    } else {
                        this.titanAnnouncement = false;
                    }
                }

                // Minigun Unlock Announcement (shows for 2 seconds)
                if (this.minigunUnlockAnnouncement) {
                    const announcementDuration = 2000;
                    const timeSinceAnnouncement = currentTime - this.minigunAnnouncementTime;

                    if (timeSinceAnnouncement < announcementDuration) {
                        const fadeIn = Math.min(1, timeSinceAnnouncement / 200);
                        const fadeOut = Math.max(0, 1 - (timeSinceAnnouncement - announcementDuration + 300) / 300);
                        const alpha = Math.min(fadeIn, fadeOut);

                        // Dark overlay behind text
                        ctx.fillStyle = `rgba(80, 40, 0, ${alpha * 0.7})`;
                        ctx.fillRect(0, CANVAS_HEIGHT / 2 - 40, CANVAS_WIDTH, 80);

                        // Glowing text effect
                        ctx.textAlign = 'center';
                        ctx.font = 'bold 32px Courier New';

                        // Shadow/glow
                        ctx.shadowColor = '#ff8800';
                        ctx.shadowBlur = 15 + Math.sin(currentTime / 80) * 8;
                        ctx.fillStyle = `rgba(255, 136, 0, ${alpha})`;
                        ctx.fillText('MINIGUN UNLOCKED!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);

                        // Main text
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                        ctx.fillText('MINIGUN UNLOCKED!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);

                        // Subtitle
                        ctx.font = '16px Courier New';
                        ctx.fillStyle = `rgba(255, 200, 100, ${alpha})`;
                        ctx.fillText('HOLD Q TO FIRE!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 25);

                        ctx.shadowColor = 'transparent';
                    } else {
                        this.minigunUnlockAnnouncement = false;
                    }
                }
            }

                ctx.fillRect(CANVAS_WIDTH / 2 - 130, 360, 260, 28);

                ctx.fillStyle = `rgb(100, ${Math.floor(200 * pulse + 55)}, 100)`;
                ctx.font = 'bold 18px Courier New';
                ctx.globalAlpha = pulse;
                ctx.fillText('[ Press ENTER to Restart ]', CANVAS_WIDTH / 2, 380);
                ctx.globalAlpha = 1;
            }

            gameLoop(currentTime) {
                this.update(currentTime);
                this.draw();
                requestAnimationFrame((time) => this.gameLoop(time));
            }

            start() {
                this.lastTime = performance.now();
                requestAnimationFrame((time) => this.gameLoop(time));
            }
        }

        // ============================================
        // START GAME
        // ============================================
        const game = new Game();
        game.start();
    </script>
</body>
</html>
