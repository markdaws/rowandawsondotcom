                        this.velocityY = 0;
                        this.isJumping = false;
                        this.isGroundSmashing = false;
                    }
                }

                // Punch animation
                if (this.isPunching) {
                    this.punchAnimTime -= deltaTime * 1000;
                    if (this.punchAnimTime <= 0) {
                        this.isPunching = false;
                    }
                }

                // Ground smash effect
                if (this.groundSmashEffect) {
                    this.groundSmashEffect.life -= deltaTime * 3;
                    if (this.groundSmashEffect.life <= 0) {
                        this.groundSmashEffect = null;
                    }
                }

                // Decay juice effects
                this.recoil *= 0.85;
                this.squashX += (1 - this.squashX) * deltaTime * 15;
                this.squashY += (1 - this.squashY) * deltaTime * 15;
                this.muzzleFlash -= deltaTime * 15;
                if (this.muzzleFlash < 0) this.muzzleFlash = 0;
                this.landSquash -= deltaTime;
            }

            applyRecoil(amount) {
                this.recoil = amount;
            }

            triggerMuzzleFlash() {
                this.muzzleFlash = 1;
            }

            jump() {
                if (!this.isJumping && this.y >= this.groundY) {
                    this.isJumping = true;
                    this.velocityY = JUMP_VELOCITY;
                    return true;
                }
                return false;
            }

            canGroundSmash(currentTime) {
                return this.isJumping &&
                       !this.isGroundSmashing &&
                       currentTime - this.lastGroundSmashTime >= GROUND_SMASH_COOLDOWN;
            }

            groundSmash(currentTime) {
                if (this.canGroundSmash(currentTime)) {
                    this.isGroundSmashing = true;
                    this.velocityY = 600; // Fast downward
                    this.lastGroundSmashTime = currentTime;
                    return true;
                }
                return false;
            }

            triggerSmashEffect() {
                this.groundSmashEffect = {
                    x: this.x + this.width / 2,
                    y: this.groundY + this.height,
                    life: 1
                };
            }

            canPunch(currentTime) {
                return currentTime - this.lastPunchTime >= PUNCH_COOLDOWN;
            }

            canShoot(currentTime) {
                return currentTime - this.lastShootTime >= SHOOT_COOLDOWN;
            }

            canShootMinigun(currentTime) {
                return currentTime - this.lastMinigunTime >= MINIGUN_COOLDOWN;
            }

            shootMinigun(currentTime) {
                if (this.canShootMinigun(currentTime)) {
                    this.lastMinigunTime = currentTime;
                    return true;
                }
                return false;
            }

            punch(currentTime) {
                if (this.canPunch(currentTime)) {
                    this.lastPunchTime = currentTime;
                    this.isPunching = true;
                    this.punchAnimTime = 150;
                    return true;
                }
                return false;
            }

            shoot(currentTime) {
                if (this.canShoot(currentTime)) {
                    this.lastShootTime = currentTime;
                    return true;
                }
                return false;
            }

            getPunchHitbox() {
                if (this.facingRight) {
                    return {
                        x: this.x + this.width - 5,
                        y: this.y + 10,
                        width: 30,
                        height: 40
                    };
                } else {
                    return {
                        x: this.x - 25,
                        y: this.y + 10,
                        width: 30,
                        height: 40
                    };
                }
            }

            getSmashCenter() {
                return {
                    x: this.x + this.width / 2,
                    y: this.groundY + this.height
                };
            }
        }

        // ============================================
        // ZOMBIE TYPES
        // ============================================
        const ZOMBIE_TYPE = {
            NORMAL: 'normal',
            FAST: 'fast',
            RADIOACTIVE: 'radioactive',
            JUMPING: 'jumping',
            LARGE: 'large',      // Mini Boss
            TITAN: 'titan'       // Mega Boss
        };

        // ============================================
        // ZOMBIE CLASS
        // ============================================
        class Zombie {
            constructor(type = ZOMBIE_TYPE.NORMAL) {
                this.type = type;
                this.baseSpeed = CANVAS_WIDTH / ZOMBIE_TRAVEL_TIME;

                // Set properties based on type
                switch (type) {
                    case ZOMBIE_TYPE.FAST:
                        this.width = 30;
                        this.height = 50;
                        this.health = 80;
                        this.speed = this.baseSpeed * 2; // Fast zombie keeps normal speed
                        break;
                    case ZOMBIE_TYPE.RADIOACTIVE:
                        this.width = 35;
                        this.height = 55;
                        this.health = 100;
                        this.speed = this.baseSpeed * 0.5; // 0.5x speed
                        this.radioactiveRadius = 150; // Bigger radius for slowdown
                        this.hasExploded = false;
                        break;
                    case ZOMBIE_TYPE.JUMPING:
                        this.width = 35;
                        this.height = 55;
                        this.health = 100;
                        this.speed = this.baseSpeed * 0.5; // 0.5x speed
                        this.jumpTimer = Math.random() * 1000;
                        this.jumpInterval = 1500 + Math.random() * 500;
                        this.velocityY = 0;
                        this.isJumping = false;
                        break;
                    case ZOMBIE_TYPE.LARGE:
                        this.width = 105; // 3x width
                        this.height = 165; // 3x height
                        this.health = 200;
                        this.speed = this.baseSpeed * 0.5 / 1.5; // 0.5x speed, slower for large
                        break;
                    case ZOMBIE_TYPE.TITAN:
                        this.width = 140; // 4x width
                        this.height = 220; // 4x height
                        this.health = 500;
                        this.speed = this.baseSpeed * 0.5 / 2; // 0.5x speed, slower for titan
                        break;
                    default: // NORMAL
                        this.width = 35;
                        this.height = 55;
                        this.health = ZOMBIE_HEALTH;
                        this.speed = this.baseSpeed * 0.5; // 0.5x speed
                }

                this.maxHealth = this.health;
                this.x = CANVAS_WIDTH;
                this.groundY = CANVAS_HEIGHT - this.height;
                this.y = this.groundY;
                this.wobble = 0;
                this.dead = false;
                this.fadeOut = 1;
                this.atBase = false;
                this.reachedBaseTime = 0;
                this.lastAttackTime = 0;
                this.isAttacking = false;

                // Juice effects
                this.knockback = 0;
                this.knockbackVelocity = 0; // Actual physics-based knockback
                this.hitFlash = 0;
                this.squashX = 1;
                this.squashY = 1;
                this.deathRotation = 0;
                this.deathVelocityY = 0;

                // Scale factor for drawing
                this.scale = type === ZOMBIE_TYPE.TITAN ? 4 : type === ZOMBIE_TYPE.LARGE ? 3 : 1;
            }

            draw() {
                ctx.globalAlpha = this.fadeOut;
                const p = 4 * this.scale; // Pixel size scaled for zombie type

                const wobbleOffset = Math.sin(this.wobble) * 2 * this.scale;

                // Attack animation - lunge forward
                const attackOffset = (this.isAttacking ? -5 : 0) * this.scale;

                // Apply knockback and squash
                ctx.save();
                const drawX = this.x + this.knockback;
                ctx.translate(drawX + this.width / 2, this.y + this.height / 2);
                ctx.scale(this.squashX, this.squashY);
                if (this.dead) {
                    ctx.rotate(this.deathRotation);
                }
                ctx.translate(-(drawX + this.width / 2), -(this.y + this.height / 2));

                // Hit flash overlay
                const flashMix = this.hitFlash;

                // TERRARIA-STYLE PIXELATED ZOMBIE
                const baseY = this.y + wobbleOffset;

                // Get colors based on zombie type
                let skinColor, skinDark, clothColor, clothDark, eyeColor, eyeGlow;

                switch (this.type) {
                    case ZOMBIE_TYPE.FAST:
                        // Fast zombie - pale blue/white, lean
                        skinColor = flashMix > 0 ? this.mixColors('#9ab0c0', '#ffffff', flashMix) : '#9ab0c0';
                        skinDark = flashMix > 0 ? this.mixColors('#7090a0', '#ffffff', flashMix) : '#7090a0';
                        clothColor = flashMix > 0 ? this.mixColors('#3a4a5a', '#ffffff', flashMix) : '#3a4a5a';
                        clothDark = flashMix > 0 ? this.mixColors('#2a3a4a', '#ffffff', flashMix) : '#2a3a4a';
                        eyeColor = '#00ffff';
                        eyeGlow = 'rgba(0, 255, 255, 0.4)';
                        break;
                    case ZOMBIE_TYPE.RADIOACTIVE:
                        // Radioactive zombie - glowing green
                        skinColor = flashMix > 0 ? this.mixColors('#50ff50', '#ffffff', flashMix) : '#50ff50';
                        skinDark = flashMix > 0 ? this.mixColors('#30cc30', '#ffffff', flashMix) : '#30cc30';
                        clothColor = flashMix > 0 ? this.mixColors('#404040', '#ffffff', flashMix) : '#404040';
                        clothDark = flashMix > 0 ? this.mixColors('#303030', '#ffffff', flashMix) : '#303030';
                        eyeColor = '#ffff00';
                        eyeGlow = 'rgba(100, 255, 100, 0.5)';
                        // Draw radioactive danger zone
                        const pulse = Math.sin(performance.now() / 300) * 0.05 + 0.1;
                        const gradient = ctx.createRadialGradient(
                            drawX + this.width/2, this.y + this.height/2, 0,
                            drawX + this.width/2, this.y + this.height/2, this.radioactiveRadius
                        );
                        gradient.addColorStop(0, `rgba(80, 255, 80, ${pulse + 0.1})`);
                        gradient.addColorStop(0.5, `rgba(80, 255, 80, ${pulse * 0.5})`);
                        gradient.addColorStop(1, 'rgba(80, 255, 80, 0)');
                        ctx.fillStyle = gradient;
                        ctx.beginPath();
                        ctx.arc(drawX + this.width/2, this.y + this.height/2, this.radioactiveRadius, 0, Math.PI * 2);
                        ctx.fill();
                        // Inner glow around zombie
                        ctx.fillStyle = 'rgba(80, 255, 80, 0.2)';
                        ctx.beginPath();
                        ctx.arc(drawX + this.width/2, this.y + this.height/2, this.width, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    case ZOMBIE_TYPE.JUMPING:
                        // Jumping zombie - reddish/demonic
                        skinColor = flashMix > 0 ? this.mixColors('#c07070', '#ffffff', flashMix) : '#c07070';
                        skinDark = flashMix > 0 ? this.mixColors('#905050', '#ffffff', flashMix) : '#905050';
                        clothColor = flashMix > 0 ? this.mixColors('#5a3030', '#ffffff', flashMix) : '#5a3030';
                        clothDark = flashMix > 0 ? this.mixColors('#402020', '#ffffff', flashMix) : '#402020';
                        eyeColor = '#ff0000';
                        eyeGlow = 'rgba(255, 0, 0, 0.5)';
                        break;
                    case ZOMBIE_TYPE.LARGE:
                        // Large zombie (Mini Boss) - darker, more menacing
                        skinColor = flashMix > 0 ? this.mixColors('#5a6a5a', '#ffffff', flashMix) : '#5a6a5a';
                        skinDark = flashMix > 0 ? this.mixColors('#3a4a3a', '#ffffff', flashMix) : '#3a4a3a';
                        clothColor = flashMix > 0 ? this.mixColors('#3a3a4a', '#ffffff', flashMix) : '#3a3a4a';
                        clothDark = flashMix > 0 ? this.mixColors('#2a2a3a', '#ffffff', flashMix) : '#2a2a3a';
                        eyeColor = '#ff4400';
                        eyeGlow = 'rgba(255, 100, 0, 0.5)';
                        break;
                    case ZOMBIE_TYPE.TITAN:
                        // Titan (Mega Boss) - dark purple/black, glowing eyes
                        skinColor = flashMix > 0 ? this.mixColors('#4a3a5a', '#ffffff', flashMix) : '#4a3a5a';
                        skinDark = flashMix > 0 ? this.mixColors('#2a1a3a', '#ffffff', flashMix) : '#2a1a3a';
                        clothColor = flashMix > 0 ? this.mixColors('#1a1a2a', '#ffffff', flashMix) : '#1a1a2a';
                        clothDark = flashMix > 0 ? this.mixColors('#0a0a1a', '#ffffff', flashMix) : '#0a0a1a';
                        eyeColor = '#ff00ff';
                        eyeGlow = 'rgba(255, 0, 255, 0.7)';
                        // Draw ominous aura around Titan
                        ctx.fillStyle = 'rgba(100, 0, 150, 0.2)';
                        ctx.beginPath();
                        ctx.arc(drawX + this.width/2, this.y + this.height/2, this.width * 0.8, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    default: // NORMAL
                        skinColor = flashMix > 0 ? this.mixColors('#7a9a7a', '#ffffff', flashMix) : '#7a9a7a';
                        skinDark = flashMix > 0 ? this.mixColors('#5a7a5a', '#ffffff', flashMix) : '#5a7a5a';
                        clothColor = flashMix > 0 ? this.mixColors('#4a5a6a', '#ffffff', flashMix) : '#4a5a6a';
                        clothDark = flashMix > 0 ? this.mixColors('#3a4a5a', '#ffffff', flashMix) : '#3a4a5a';
                        eyeColor = '#ff2200';
                        eyeGlow = 'rgba(255, 50, 0, 0.4)';
                }

                // Scale all positions
                const s = this.scale;

                // Feet (bare/rotting)
                ctx.fillStyle = skinDark;
                ctx.fillRect(drawX + 6*s + attackOffset, baseY + 48*s, p*2, p*2);
                ctx.fillRect(drawX + 22*s + attackOffset, baseY + 48*s, p*2, p*2);

                // Legs (tattered pants)
                ctx.fillStyle = clothDark;
                ctx.fillRect(drawX + 8*s + attackOffset, baseY + 38*s, p*2, p*3);
                ctx.fillRect(drawX + 20*s + attackOffset, baseY + 38*s, p*2, p*3);

                // Torn fabric pixels
                ctx.fillStyle = clothColor;
                ctx.fillRect(drawX + 8*s + attackOffset, baseY + 38*s, p, p*2);
                ctx.fillRect(drawX + 22*s + attackOffset, baseY + 40*s, p, p*2);

                // Body (torn shirt)
                ctx.fillStyle = clothColor;
                ctx.fillRect(drawX + 4*s + attackOffset, baseY + 18*s, p*7, p*5);

                // Body shading/tears
                ctx.fillStyle = clothDark;
                ctx.fillRect(drawX + 4*s + attackOffset, baseY + 22*s, p*2, p*3);
                ctx.fillRect(drawX + 20*s + attackOffset, baseY + 26*s, p*2, p*2);

                // Exposed skin through tears
                ctx.fillStyle = skinColor;
                ctx.fillRect(drawX + 12*s + attackOffset, baseY + 24*s, p*2, p*2);

                // Head (zombie)
                ctx.fillStyle = skinColor;
                ctx.fillRect(drawX + 8*s + attackOffset, baseY + 2*s, p*5, p*4);

                // Head shading
                ctx.fillStyle = skinDark;
                ctx.fillRect(drawX + 8*s + attackOffset, baseY + 2*s, p, p*4);
                ctx.fillRect(drawX + 8*s + attackOffset, baseY + 14*s, p*5, p);

                // Messy hair (different for each type)
                ctx.fillStyle = this.type === ZOMBIE_TYPE.RADIOACTIVE ? '#205020' :
                               this.type === ZOMBIE_TYPE.FAST ? '#506070' :
                               this.type === ZOMBIE_TYPE.JUMPING ? '#402020' :
                               this.type === ZOMBIE_TYPE.LARGE ? '#202020' : '#3a4a3a';
                ctx.fillRect(drawX + 6*s + attackOffset, baseY, p*6, p);
                ctx.fillRect(drawX + 4*s + attackOffset, baseY + 2*s, p, p*2);
                ctx.fillRect(drawX + 26*s + attackOffset, baseY + 2*s, p, p);

                // Type-specific features
                if (this.type === ZOMBIE_TYPE.JUMPING) {
                    // Horns for jumping zombie
                    ctx.fillStyle = '#402020';
                    ctx.fillRect(drawX + 6*s + attackOffset, baseY - 4*s, p, p*2);
                    ctx.fillRect(drawX + 24*s + attackOffset, baseY - 4*s, p, p*2);
                }
                if (this.type === ZOMBIE_TYPE.LARGE) {
                    // Spikes on shoulders for large zombie
                    ctx.fillStyle = '#3a3a3a';
                    ctx.fillRect(drawX + 2*s + attackOffset, baseY + 16*s, p, p*2);
                    ctx.fillRect(drawX + 30*s + attackOffset, baseY + 16*s, p, p*2);
                }

                // Glowing eyes
                ctx.fillStyle = eyeColor;
                ctx.fillRect(drawX + 10*s + attackOffset, baseY + 6*s, p, p);
                ctx.fillRect(drawX + 18*s + attackOffset, baseY + 6*s, p, p);

                // Eye glow effect
                ctx.fillStyle = eyeGlow;
                ctx.fillRect(drawX + 8*s + attackOffset, baseY + 4*s, p*2, p*2);
                ctx.fillRect(drawX + 16*s + attackOffset, baseY + 4*s, p*2, p*2);

                // Mouth/teeth
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(drawX + 12*s + attackOffset, baseY + 12*s, p*2, p);
                ctx.fillStyle = '#dddddd';
                ctx.fillRect(drawX + 13*s + attackOffset, baseY + 12*s, 2*s, 2*s);
                ctx.fillRect(drawX + 17*s + attackOffset, baseY + 12*s, 2*s, 2*s);

                // Arms reaching forward
                ctx.fillStyle = skinColor;
                const armExtend = (this.isAttacking ? -10 : -4) * s;
                ctx.fillRect(drawX + armExtend + attackOffset, baseY + 20*s, p*3, p*2);
                ctx.fillRect(drawX + armExtend - 4*s + attackOffset, baseY + 22*s, p*2, p*2);

                // Claw hand
                ctx.fillStyle = skinDark;
                ctx.fillRect(drawX + armExtend - 6*s + attackOffset, baseY + 20*s, p, p);
                ctx.fillRect(drawX + armExtend - 6*s + attackOffset, baseY + 24*s, p, p);
                ctx.fillRect(drawX + armExtend - 6*s + attackOffset, baseY + 28*s, p, p);

                ctx.restore(); // Restore from squash/knockback transform

                // DAMAGE DEGRADATION - visual wounds based on health
                const healthPercent = this.health / this.maxHealth;
                const damageDrawX = this.x + this.knockback;

                if (healthPercent < 1 && !this.dead) {
                    // Blood drips (more as health decreases)
                    ctx.fillStyle = '#8b0000';

                    if (healthPercent < 0.9) {
                        // Minor scratches
                        ctx.fillRect(damageDrawX + 12*s, this.y + 8*s, p*0.5, p*2);
                    }

                    if (healthPercent < 0.7) {
                        // Wound on body
                        ctx.fillStyle = '#660000';
                        ctx.fillRect(damageDrawX + 16*s, this.y + 24*s, p*2, p*2);
                        ctx.fillStyle = '#8b0000';
                        ctx.fillRect(damageDrawX + 16*s, this.y + 28*s, p, p*3);
                        // Chunk missing from head
                        ctx.fillStyle = '#4a0000';
                        ctx.fillRect(damageDrawX + 22*s, this.y + 4*s, p*1.5, p*2);
                    }

                    if (healthPercent < 0.5) {
                        // More severe damage - exposed bone/ribs
                        ctx.fillStyle = '#ddccbb';
                        ctx.fillRect(damageDrawX + 8*s, this.y + 26*s, p, p*2);
                        ctx.fillRect(damageDrawX + 10*s, this.y + 28*s, p, p*1.5);
                        // Bigger wound
                        ctx.fillStyle = '#550000';
                        ctx.fillRect(damageDrawX + 18*s, this.y + 22*s, p*3, p*3);
                        // Blood splatter
                        ctx.fillStyle = '#8b0000';
                        ctx.fillRect(damageDrawX + 6*s, this.y + 32*s, p, p*2);
                        ctx.fillRect(damageDrawX + 24*s, this.y + 30*s, p, p*3);
                    }

                    if (healthPercent < 0.3) {
                        // Critical damage - missing limb appearance
                        ctx.fillStyle = '#330000';
                        ctx.fillRect(damageDrawX + 4*s, this.y + 20*s, p*2, p*4);
                        // Skull showing through
                        ctx.fillStyle = '#ccbbaa';
                        ctx.fillRect(damageDrawX + 10*s, this.y + 2*s, p*2, p*2);
                        // More blood
                        ctx.fillStyle = '#8b0000';
                        ctx.fillRect(damageDrawX + 14*s, this.y + 40*s, p*0.5, p*4);
                        ctx.fillRect(damageDrawX + 20*s, this.y + 36*s, p*0.5, p*5);
                    }
                }

                ctx.globalAlpha = 1;

                // Health bar (only if alive and damaged)
                if (!this.dead && this.health < this.maxHealth) {
                    this.drawHealthBar();
                }

                // Draw radioactive warning indicator
                if (this.type === ZOMBIE_TYPE.RADIOACTIVE && !this.dead) {
                    ctx.fillStyle = 'rgba(100, 255, 100, ' + (0.3 + Math.sin(this.wobble * 2) * 0.2) + ')';
                    ctx.beginPath();
                    ctx.arc(this.x + this.width/2, this.y + this.height/2, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            mixColors(color1, color2, mix) {
                const r1 = parseInt(color1.slice(1, 3), 16);
                const g1 = parseInt(color1.slice(3, 5), 16);
                const b1 = parseInt(color1.slice(5, 7), 16);
                const r2 = parseInt(color2.slice(1, 3), 16);
                const g2 = parseInt(color2.slice(3, 5), 16);
                const b2 = parseInt(color2.slice(5, 7), 16);
                const r = Math.round(r1 + (r2 - r1) * mix);
                const g = Math.round(g1 + (g2 - g1) * mix);
                const b = Math.round(b1 + (b2 - b1) * mix);
                return `rgb(${r},${g},${b})`;
            }

            drawHealthBar() {
                const barWidth = 30 * this.scale;
                const barHeight = 5 * this.scale;
                const barX = this.x + (this.width - barWidth) / 2;
                const barY = this.y - 10 * this.scale;

                // Background
                ctx.fillStyle = '#333';
                ctx.fillRect(barX, barY, barWidth, barHeight);

                // Health - color based on type
                const healthPercent = this.health / this.maxHealth;
                let healthColor;
                if (this.type === ZOMBIE_TYPE.RADIOACTIVE) {
                    healthColor = '#50ff50';
                } else if (this.type === ZOMBIE_TYPE.FAST) {
                    healthColor = '#50ffff';
                } else if (this.type === ZOMBIE_TYPE.TITAN) {
                    healthColor = '#ff00ff';
                } else {
                    healthColor = healthPercent > 0.5 ? '#4CAF50' : healthPercent > 0.25 ? '#FF9800' : '#f44336';
                }
                ctx.fillStyle = healthColor;
                ctx.fillRect(barX, barY, barWidth * healthPercent, barHeight);

                // Border
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY, barWidth, barHeight);

                // Type indicator for special zombies
                if (this.type !== ZOMBIE_TYPE.NORMAL) {
                    ctx.font = (8 * this.scale) + 'px Courier New';
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    const label = this.type === ZOMBIE_TYPE.FAST ? 'FAST' :
                                 this.type === ZOMBIE_TYPE.RADIOACTIVE ? 'RAD' :
                                 this.type === ZOMBIE_TYPE.JUMPING ? 'JUMP' :
                                 this.type === ZOMBIE_TYPE.LARGE ? 'MINI BOSS' :
                                 this.type === ZOMBIE_TYPE.TITAN ? 'TITAN' : '';
                    ctx.fillText(label, this.x + this.width/2, barY - 2);
                }
            }

            update(deltaTime, currentTime, base) {
                // Decay juice effects
                this.knockback *= 0.9;
                this.hitFlash -= deltaTime * 10;
                if (this.hitFlash < 0) this.hitFlash = 0;
                this.squashX += (1 - this.squashX) * deltaTime * 12;
                this.squashY += (1 - this.squashY) * deltaTime * 12;

                // Apply knockback physics - actually move the zombie
                if (Math.abs(this.knockbackVelocity) > 5) {
                    this.x += this.knockbackVelocity * deltaTime;
                    // Apply friction (decelerate) - lose ~90% velocity over ~0.3 seconds
                    const friction = Math.pow(0.001, deltaTime);
                    this.knockbackVelocity *= friction;
                    // Keep zombie in bounds
                    if (this.x > CANVAS_WIDTH - this.width) {
                        this.x = CANVAS_WIDTH - this.width;
                        this.knockbackVelocity = 0;
                    }
                    // If knocked back from base, no longer at base
                    if (this.atBase && this.x > base.x + base.width + 10) {
                        this.atBase = false;
                    }
                } else {
                    this.knockbackVelocity = 0;
                }

                if (this.dead) {
                    this.fadeOut -= deltaTime * 2;
                    this.deathRotation += deltaTime * 5;
                    this.deathVelocityY += 500 * deltaTime;
                    this.y += this.deathVelocityY * deltaTime;
                    return { remove: this.fadeOut <= 0 || this.y > CANVAS_HEIGHT + 50, damage: 0, radioactiveDeath: false };
                }

                this.wobble += deltaTime * 8;
                this.isAttacking = false;

                // Jumping zombie behavior
                if (this.type === ZOMBIE_TYPE.JUMPING && !this.atBase) {
                    this.jumpTimer += deltaTime * 1000;

                    // Jump periodically
                    if (this.jumpTimer >= this.jumpInterval && !this.isJumping) {
                        this.isJumping = true;
                        this.velocityY = -350;
                        this.jumpTimer = 0;
                    }

                    // Apply gravity
                    if (this.isJumping || this.y < this.groundY) {
                        this.velocityY += 800 * deltaTime;
                        this.y += this.velocityY * deltaTime;

                        if (this.y >= this.groundY) {
                            this.y = this.groundY;
                            this.velocityY = 0;
                            this.isJumping = false;
                        }
                    }
                }

                // If at base, attack periodically
                if (this.atBase) {
                    const timeSinceReached = currentTime - this.reachedBaseTime;

                    // Radioactive zombie explodes after 10 seconds at base
                    if (this.type === ZOMBIE_TYPE.RADIOACTIVE && timeSinceReached >= 10000 && !this.hasExploded) {
                        this.hasExploded = true;
                        this.dead = true;
                        return { remove: false, damage: 50, radioactiveExplosion: true };
                    }

                    // Normal disappear after 10 seconds (non-radioactive)
                    if (this.type !== ZOMBIE_TYPE.RADIOACTIVE && timeSinceReached >= 10000) {
                        return { remove: true, damage: 0, radioactiveDeath: false };
                    }

                    // Wait 1 second before first attack
                    if (timeSinceReached >= ZOMBIE_ATTACK_DELAY) {
                        // Attack every 0.5 seconds
                        if (currentTime - this.lastAttackTime >= ZOMBIE_ATTACK_INTERVAL) {
                            this.lastAttackTime = currentTime;
                            this.isAttacking = true;
                            return { remove: false, damage: ZOMBIE_BASE_DAMAGE, radioactiveDeath: false };
                        }
                    }
                    return { remove: false, damage: 0, radioactiveDeath: false };
                }

                // Move toward base
                this.x -= this.speed * deltaTime;

                // Check if reached base
                if (this.x <= base.x + base.width) {
                    this.x = base.x + base.width;
                    this.atBase = true;
                    this.reachedBaseTime = currentTime;
                }

                return { remove: false, damage: 0, radioactiveDeath: false };
            }

            takeDamage(amount, knockbackAmount = 15) {
                this.health -= amount;

                // Hit juice - scale knockback for large zombies
                this.knockback = knockbackAmount / this.scale;
                // Physics knockback - push zombie back (positive = right)
                this.knockbackVelocity = (knockbackAmount * 15) / this.scale;
                this.hitFlash = 1;
                this.squashX = 1.3;
                this.squashY = 0.7;

                if (this.health <= 0) {
                    this.dead = true;
                    this.deathVelocityY = -150 / this.scale;
                    return { died: true, isRadioactive: this.type === ZOMBIE_TYPE.RADIOACTIVE };
                }
                return { died: false, isRadioactive: false };
            }

            // Get center position for radioactive effect
            getCenter() {
                return {
                    x: this.x + this.width / 2,
                    y: this.y + this.height / 2
                };
            }

            getHitbox() {
                return {
                    x: this.x,
                    y: this.y,
                    width: this.width,
                    height: this.height
                };
            }
        }

        // ============================================
        // PROJECTILE CLASS
        // ============================================
        class Projectile {
            constructor(x, y, direction = 1, damage = SHOOT_DAMAGE, isMinigun = false) {
                this.x = x;
                this.y = y;
                this.direction = direction; // 1 = right, -1 = left
                this.width = isMinigun ? 6 : 10;
                this.height = isMinigun ? 3 : 5;
                this.speed = PROJECTILE_SPEED;
                this.damage = damage;
                this.isMinigun = isMinigun;
                this.trail = [];
                this.trailLength = isMinigun ? 4 : 8;
            }

            draw() {
                const p = 3; // Pixel size

                // Draw pixelated trail
                for (let i = 0; i < this.trail.length; i++) {
                    const t = this.trail[i];
                    const alpha = (i / this.trail.length) * 0.7;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = '#ff8800';
                    ctx.fillRect(t.x - p/2, t.y - p/2, p, p);
                    if (i % 2 === 0) {
                        ctx.fillStyle = '#ffaa44';
                        ctx.fillRect(t.x - p/2, t.y - p, p, p);
                    }
                }
                ctx.globalAlpha = 1;

                // Glow effect (Terraria-style magic projectile)
                ctx.fillStyle = 'rgba(255, 200, 100, 0.4)';
                ctx.fillRect(this.x - 8, this.y - 4, 16, 8);

                // Bullet body (pixelated)
                ctx.fillStyle = '#ffdd44';
                ctx.fillRect(this.x - 4, this.y - 2, p*3, p*2);

                // Bullet highlight
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(this.x + 2, this.y - 1, p, p);

                // Bullet dark edge
                ctx.fillStyle = '#cc9900';
                ctx.fillRect(this.x - 4, this.y + 1, p, p);

                // Sparkle particles
                const sparkle = Math.random();
                if (sparkle > 0.7) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(this.x + Math.random() * 10 - 5, this.y + Math.random() * 6 - 3, 2, 2);
                }
            }

            update(deltaTime) {
                // Add to trail
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }

                this.x += this.speed * deltaTime * this.direction;
                // Remove if off screen (either side)
                return this.x > CANVAS_WIDTH || this.x < 0;
            }

            getHitbox() {
                return {
                    x: this.x - this.width / 2,
                    y: this.y - this.height / 2,
                    width: this.width,
                    height: this.height
                };
            }
        }

        // ============================================
        // SHELL CASING CLASS
        // ============================================
        class ShellCasing {
            constructor(x, y, direction, isMinigun = false) {
                this.x = x;
                this.y = y;
                this.width = isMinigun ? 3 : 4;
                this.height = isMinigun ? 2 : 3;
                // Eject backwards and upward
                this.velocityX = -direction * (80 + Math.random() * 60);
                this.velocityY = -(100 + Math.random() * 80);
                this.rotation = 0;
                this.rotationSpeed = (Math.random() - 0.5) * 20;
                this.groundY = CANVAS_HEIGHT - 5 - Math.random() * 10;
                this.isMinigun = isMinigun;
                this.onGround = false;
                this.fadeTimer = 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Brass shell casing
                ctx.fillStyle = '#daa520';
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);

                // Highlight
                ctx.fillStyle = '#ffd700';
                ctx.fillRect(-this.width/2, -this.height/2, this.width * 0.3, this.height * 0.5);

                // Dark end
                ctx.fillStyle = '#b8860b';
                ctx.fillRect(this.width/2 - 1, -this.height/2, 1, this.height);

                ctx.restore();
            }

            update(deltaTime) {
                if (!this.onGround) {
                    // Apply gravity
                    this.velocityY += 600 * deltaTime;
                    this.x += this.velocityX * deltaTime;
                    this.y += this.velocityY * deltaTime;
                    this.rotation += this.rotationSpeed * deltaTime;

                    // Air friction
                    this.velocityX *= 0.99;

                    // Hit ground
                    if (this.y >= this.groundY) {
                        this.y = this.groundY;
                        this.onGround = true;
                        // Small bounce
                        if (Math.abs(this.velocityY) > 50) {
                            this.velocityY = -this.velocityY * 0.3;
                            this.onGround = false;
                        } else {
                            this.velocityY = 0;
                            this.rotationSpeed = 0;
                        }
                    }
                } else {
                    // Fade out on ground
                    this.fadeTimer += deltaTime;
                    if (this.fadeTimer > 2) {
                        return true; // Remove
                    }
                }
                return false;
            }
        }

        // ============================================
        // GAME CLASS
        // ============================================
        class Game {
            constructor() {
                this.state = SPLASH;
                this.player = new Player();
                this.base = new Base();
                this.zombies = [];
                this.projectiles = [];
                this.shellCasings = [];
                this.score = 0;
                this.highScore = 0;
                this.spawnInterval = INITIAL_SPAWN_INTERVAL;
                this.lastSpawnTime = 0;
                this.lastTime = 0;
                this.keys = {};
                this.keysJustPressed = {};
                this.hitEffects = [];
                this.splashMusicStarted = false;
                this.pendingGroundSmash = false;

                // Juice systems
                this.screenEffects = new ScreenEffects();
                this.particles = new ParticleSystem();
                this.damageNumbers = [];

                // Terraria-style background
                this.background = new Background();

                // Player slowdown from radioactive zombies
                this.playerSlowedUntil = 0;
                this.playerNormalSpeed = PLAYER_SPEED;

                // Track score for large zombie spawning (every 100 points)
                this.lastLargeZombieScore = 0;

                // Titan announcement and tracking
                this.titanAnnouncement = false;
                this.titanAnnouncementTime = 0;
                this.activeTitan = null;

                // Minigun unlock tracking
                this.consecutiveJumps = 0;
                this.lastJumpTime = 0;
                this.hasMinigun = false;
                this.minigunUnlockAnnouncement = false;
                this.minigunAnnouncementTime = 0;

                // Super punch charge tracking
                this.punchChargeStart = 0;
                this.isPunchCharging = false;
                this.superPunchReady = false;

                this.setupInput();
            }

            setupInput() {
                // Initialize sound on first interaction
                const initSound = () => {
                    soundManager.init();
                    soundManager.resume();
                    if (this.state === SPLASH && !this.splashMusicStarted) {
                        soundManager.playSplashMusic();
                        this.splashMusicStarted = true;
                    }
                };

                // Keyboard input
                window.addEventListener('keydown', (e) => {
                    initSound();
                    const key = e.key.toLowerCase();
                    const wasPressed = this.keys[key];
                    this.keys[key] = true;

                    // Track if key was just pressed (for tap detection)
                    if (!wasPressed) {
                        this.keysJustPressed[key] = true;
                    }

                    if (e.key === ' ') {
                        e.preventDefault();
                        if (this.state === SPLASH) {
                            this.startGame();
                        } else if (this.state === PLAYING && !wasPressed) {
                            // Start charging punch
                            this.punchChargeStart = performance.now();
                            this.isPunchCharging = true;
                            this.superPunchReady = false;
                        }
                    }

                    // Enter to restart after game over
                    if (e.key === 'Enter' && this.state === GAME_OVER) {
                        this.startGame();
                    }

                    if (key === 'q' && this.state === PLAYING) {
                        this.handleShoot();
                    }

                    if ((key === 'w' || e.code === 'ArrowUp') && this.state === PLAYING && !wasPressed) {
                        this.handleJump();
                    }

                    if ((key === 's' || e.code === 'ArrowDown') && this.state === PLAYING && !wasPressed) {
                        this.handleGroundSmash();
                    }
                });

                window.addEventListener('keyup', (e) => {
                    this.keys[e.key.toLowerCase()] = false;
                    this.keysJustPressed[e.key.toLowerCase()] = false;

                    // Handle punch release
                    if (e.key === ' ' && this.state === PLAYING && this.isPunchCharging) {
                        const chargeTime = performance.now() - this.punchChargeStart;
                        this.isPunchCharging = false;
                        if (chargeTime >= 2000) {
                            // Super punch!
                            this.handleSuperPunch();
                        } else {
                            // Normal punch
                            this.handlePunch();
                        }
                    }
                });

                // Touch controls
                const btnLeft = document.getElementById('btnLeft');
                const btnRight = document.getElementById('btnRight');
                const btnPunch = document.getElementById('btnPunch');
                const btnShoot = document.getElementById('btnShoot');
                const btnJump = document.getElementById('btnJump');
                const btnSmash = document.getElementById('btnSmash');

                // Movement buttons
                btnLeft.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.keys['a'] = true;
                });
                btnLeft.addEventListener('touchend', () => this.keys['a'] = false);

                btnRight.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.keys['d'] = true;
                });
                btnRight.addEventListener('touchend', () => this.keys['d'] = false);

                // Attack buttons
                btnPunch.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    initSound();
                    if (this.state === SPLASH) {
                        this.startGame();
                    } else if (this.state === GAME_OVER) {
                        this.startGame();
                    } else if (this.state === PLAYING) {
                        // Start charging punch
                        this.punchChargeStart = performance.now();
                        this.isPunchCharging = true;
                        this.superPunchReady = false;
                    }
                });
                btnPunch.addEventListener('touchend', (e) => {
                    if (this.state === PLAYING && this.isPunchCharging) {
                        const chargeTime = performance.now() - this.punchChargeStart;
                        this.isPunchCharging = false;
                        if (chargeTime >= 2000) {
                            this.handleSuperPunch();
                        } else {
                            this.handlePunch();
                        }
                    }
                });

                btnShoot.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    initSound();
                    if (this.state === PLAYING) {
                        this.keys['q'] = true; // Enable continuous fire for minigun
                        this.handleShoot();
                    }
                });
                btnShoot.addEventListener('touchend', () => {
                    this.keys['q'] = false;
                });

                btnJump.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    initSound();
                    if (this.state === PLAYING) {
                        this.handleJump();
                    }
                });

                btnSmash.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    initSound();
                    if (this.state === PLAYING) {
                        this.handleGroundSmash();
                    }
                });

                // Also init sound on any click/touch
                canvas.addEventListener('click', initSound);
                canvas.addEventListener('touchstart', initSound);
            }

            handlePunch() {
                const currentTime = performance.now();
                if (this.player.punch(currentTime)) {
                    soundManager.playPunch();

                    // Small screen shake for punch
                    this.screenEffects.shake(3, 0.1);

                    // Check for zombie hits
                    const punchBox = this.player.getPunchHitbox();
                    let hitCount = 0;
                    this.zombies.forEach(zombie => {
                        if (!zombie.dead && this.checkCollision(punchBox, zombie.getHitbox())) {
                            // 10% chance to knock back on punch
                            const punchKnockback = Math.random() < 0.10 ? 50 : 0;
                            const result = zombie.takeDamage(PUNCH_DAMAGE, punchKnockback);
                            soundManager.playHit(0.8 + Math.random() * 0.4);
                            if (result.died) {
                                const scoreMultiplier = zombie.type === ZOMBIE_TYPE.TITAN ? 10 :
                                                       zombie.type === ZOMBIE_TYPE.LARGE ? 3 : 1;
                                this.score += KILL_SCORE * scoreMultiplier;
                                this.highScore = Math.max(this.highScore, this.score);

                                // Clear Titan reference if killed
                                if (zombie.type === ZOMBIE_TYPE.TITAN) {
                                    this.activeTitan = null;
                                    this.screenEffects.shake(20, 0.5);
                                    this.screenEffects.flash('rgba(255, 0, 255, 0.5)', 0.5);
                                }
                                this.screenEffects.hitstop(0.05);
                                this.screenEffects.shake(6, 0.15);
                                soundManager.playZombieDeath();

                                // Check for radioactive death - slow player if nearby
                                if (result.isRadioactive) {
                                    const zombieCenter = zombie.getCenter();
                                    const playerCenter = {
                                        x: this.player.x + this.player.width / 2,
                                        y: this.player.y + this.player.height / 2
                                    };
                                    const dist = Math.sqrt(
                                        Math.pow(zombieCenter.x - playerCenter.x, 2) +
                                        Math.pow(zombieCenter.y - playerCenter.y, 2)
                                    );
                                    if (dist <= zombie.radioactiveRadius) {
                                        this.playerSlowedUntil = performance.now() + 5000;
                                        this.screenEffects.flash('rgba(50, 255, 50, 0.4)', 0.5);
                                    }
                                    // Radioactive death particles
                                    this.particles.emit(zombie.x + zombie.width / 2, zombie.y + zombie.height / 2, 20, {
                                        angle: Math.PI / 2,
                                        spread: Math.PI * 2,
                                        speed: 150,
                                        colors: ['#50ff50', '#30cc30', '#80ff80'],
                                        size: 10,
                                        life: 1.2,
                                        gravity: 100,
                                        friction: 0.98
                                    });
                                }

                                // Death particles
                                const deathColors = zombie.type === ZOMBIE_TYPE.RADIOACTIVE ?
                                    ['#50ff50', '#30cc30', '#80ff80', '#8b0000'] :
                                    zombie.type === ZOMBIE_TYPE.FAST ?
                                    ['#9ab0c0', '#7090a0', '#c0d0e0', '#8b0000'] :
                                    zombie.type === ZOMBIE_TYPE.TITAN ?
                                    ['#8800ff', '#ff00ff', '#cc00cc', '#4a3a5a'] :
                                    zombie.type === ZOMBIE_TYPE.LARGE ?
                                    ['#5a6a5a', '#3a4a3a', '#7a8a7a', '#8b0000'] :
                                    ['#4a6b4a', '#6b8e6b', '#3d5a3d', '#8b0000'];
                                this.particles.emit(zombie.x + zombie.width / 2, zombie.y + zombie.height / 2, 15 * zombie.scale, {
                                    angle: Math.PI / 2,
                                    spread: Math.PI,
                                    speed: 200,
                                    colors: deathColors,
                                    size: 8 * zombie.scale,
                                    life: 0.8,
                                    gravity: 400,
                                    friction: 0.98
                                });
                            }

                            // Damage number
                            this.damageNumbers.push(new DamageNumber(
                                zombie.x + zombie.width / 2,
                                zombie.y,
                                PUNCH_DAMAGE,
                                '#ffff00'
                            ));

                            // Hit particles
                            this.particles.emit(zombie.x + zombie.width / 2, zombie.y + zombie.height / 2, 5, {
                                angle: 0,
                                spread: Math.PI * 0.5,
                                speed: 150,
                                colors: ['#ffff00', '#ffffff'],
                                size: 6,
                                life: 0.3,
                                gravity: 0,
                                friction: 0.95
                            });

                            this.hitEffects.push({
                                x: zombie.x + zombie.width / 2,
                                y: zombie.y + zombie.height / 2,
                                life: 0.2,
                                type: 'punch'
                            });
                            hitCount++;
                        }
                    });

                    // Extra shake if hit multiple
                    if (hitCount > 1) {
                        this.screenEffects.shake(5, 0.1);
                    }
                }
            }

            handleSuperPunch() {
                // Super punch - 50 damage, no cooldown, big effects!
                this.player.isPunching = true;
                this.player.punchAnimTime = 250;
                soundManager.playPunch();
                soundManager.playGroundSmash(); // Extra impact sound

                // Big screen effects
                this.screenEffects.shake(12, 0.3);
                this.screenEffects.flash('rgba(255, 200, 0, 0.4)', 0.3);
                this.screenEffects.hitstop(0.1);
                this.screenEffects.triggerChromatic(2);

                // Super punch particles
                const punchX = this.player.facingRight ?
                    this.player.x + this.player.width + 20 :
                    this.player.x - 20;
                this.particles.emit(punchX, this.player.y + 30, 20, {
                    angle: this.player.facingRight ? 0 : Math.PI,
                    spread: Math.PI * 0.5,
                    speed: 300,
                    colors: ['#ffff00', '#ff8800', '#ffffff', '#ffaa00'],
                    size: 12,
                    life: 0.5,
                    gravity: 100,
                    friction: 0.95
                });

                // Check for zombie hits with larger hitbox
                const punchBox = this.player.getPunchHitbox();
                // Extend the hitbox for super punch
                const superPunchBox = {
                    x: punchBox.x - 20,
                    y: punchBox.y - 10,
                    width: punchBox.width + 40,
                    height: punchBox.height + 20
                };

                let hitCount = 0;
                this.zombies.forEach(zombie => {
                    if (!zombie.dead && this.checkCollision(superPunchBox, zombie.getHitbox())) {
                        // Super punch always knocks back hard
                        const result = zombie.takeDamage(50, 80);
                        soundManager.playHit(1.2 + Math.random() * 0.3);

                        if (result.died) {
                            const scoreMultiplier = zombie.type === ZOMBIE_TYPE.TITAN ? 10 :
                                                   zombie.type === ZOMBIE_TYPE.LARGE ? 3 : 1;
                            this.score += KILL_SCORE * scoreMultiplier;
                            this.highScore = Math.max(this.highScore, this.score);

                            if (zombie.type === ZOMBIE_TYPE.TITAN) {
                                this.activeTitan = null;
                                this.screenEffects.shake(20, 0.5);
                                this.screenEffects.flash('rgba(255, 0, 255, 0.5)', 0.5);
                            }
                            this.screenEffects.hitstop(0.08);
                            this.screenEffects.shake(10, 0.2);
                            soundManager.playZombieDeath();

                            // Death particles
                            const deathColors = zombie.type === ZOMBIE_TYPE.TITAN ?
                                ['#8800ff', '#ff00ff', '#cc00cc', '#4a3a5a'] :
                                ['#ffff00', '#ff8800', '#ff0000', '#8b0000'];
                            this.particles.emit(zombie.x + zombie.width / 2, zombie.y + zombie.height / 2, 25 * zombie.scale, {
                                angle: this.player.facingRight ? 0 : Math.PI,
                                spread: Math.PI * 0.8,
                                speed: 400,
                                colors: deathColors,
                                size: 12 * zombie.scale,
                                life: 1,
                                gravity: 400,
                                friction: 0.97
                            });
                        }

                        // Damage number (yellow for super punch)
                        this.damageNumbers.push(new DamageNumber(
                            zombie.x + zombie.width / 2,
                            zombie.y,
                            50,
                            '#ffff00',
                            true
                        ));

                        // Big hit effect
                        this.hitEffects.push({
                            x: zombie.x + zombie.width / 2,
                            y: zombie.y + zombie.height / 2,
                            life: 0.3,
                            type: 'punch'
                        });
                        hitCount++;
                    }
                });

                // Multi-hit bonus effects
                if (hitCount > 1) {
                    this.screenEffects.shake(15, 0.3);
                    this.screenEffects.triggerChromatic(4);
                }
            }

            handleShoot() {
                const currentTime = performance.now();

                // Check for minigun unlock: 10 consecutive jumps then shoot
                if (!this.hasMinigun && this.consecutiveJumps >= 10) {
                    this.hasMinigun = true;
                    this.player.hasMinigun = true; // Sync with player for sprite
                    this.minigunUnlockAnnouncement = true;
                    this.minigunAnnouncementTime = currentTime;
                    this.consecutiveJumps = 0;
                    this.screenEffects.shake(10, 0.5);
                    this.screenEffects.flash('rgba(255, 150, 0, 0.5)', 0.5);
                    this.screenEffects.triggerChromatic(3);
                }

                // Use minigun if unlocked
                if (this.hasMinigun) {
                    if (this.player.shootMinigun(currentTime)) {
                        soundManager.playShoot();

                        // Spin the minigun barrels
                        this.player.minigunRotation += 0.8;

                        // Smaller recoil for minigun
                        this.player.applyRecoil(2);
                        this.player.triggerMuzzleFlash();

                        // Light screen shake
                        this.screenEffects.shake(1, 0.05);

                        // Smaller muzzle smoke
                        this.particles.emit(this.player.x + this.player.width + 10, this.player.y + 22, 2, {
                            angle: 0,
                            spread: Math.PI * 0.2,
                            speed: 50,
                            colors: ['#888888', '#aaaaaa'],
                            size: 5,
                            life: 0.2,
                            gravity: -30,
                            friction: 0.95
                        });

                        // Shell casing - eject from gun
                        const direction = this.player.facingRight ? 1 : -1;
                        const shellX = this.player.facingRight ?
                            this.player.x + this.player.width - 5 :
                            this.player.x + 5;
                        this.shellCasings.push(new ShellCasing(shellX, this.player.y + 25, direction, true));

                        const bulletX = this.player.facingRight ?
                            this.player.x + this.player.width :
                            this.player.x;
                        // Minigun bullet with lower damage and slight spread
                        const spread = (Math.random() - 0.5) * 8;
                        this.projectiles.push(new Projectile(bulletX, this.player.y + 22 + spread, direction, MINIGUN_DAMAGE, true));
                    }
                } else {
                    // Regular gun
                    if (this.player.shoot(currentTime)) {
                        soundManager.playShoot();

                        // Recoil and muzzle flash
                        this.player.applyRecoil(8);
                        this.player.triggerMuzzleFlash();

                        // Screen shake
                        this.screenEffects.shake(4, 0.1);
                        this.screenEffects.flash('rgba(255, 200, 0, 0.3)', 0.3);

                        // Muzzle smoke particles
                        this.particles.emit(this.player.x + this.player.width + 10, this.player.y + 22, 8, {
                            angle: 0,
                            spread: Math.PI * 0.3,
                            speed: 80,
                            colors: ['#888888', '#aaaaaa', '#666666'],
                            size: 10,
                            life: 0.4,
                            gravity: -50,
                            friction: 0.95
                        });

                        // Shell casing - eject from gun
                        const direction = this.player.facingRight ? 1 : -1;
                        const shellX = this.player.facingRight ?
                            this.player.x + this.player.width - 5 :
                            this.player.x + 5;
                        this.shellCasings.push(new ShellCasing(shellX, this.player.y + 25, direction, false));

                        const bulletX = this.player.facingRight ?
                            this.player.x + this.player.width :
                            this.player.x;
                        this.projectiles.push(new Projectile(bulletX, this.player.y + 22, direction));
                    }
                }
            }

            handleJump() {
                if (this.player.jump()) {
                    soundManager.playJump();

                    const currentTime = performance.now();
                    // Track consecutive jumps for minigun unlock
                    // Jumps must be within 2 seconds of each other to count as consecutive
                    if (currentTime - this.lastJumpTime < 2000) {
                        this.consecutiveJumps++;
                    } else {
                        this.consecutiveJumps = 1;
                    }
                    this.lastJumpTime = currentTime;

                    // Jump dust
                    this.particles.emit(this.player.x + this.player.width / 2, this.player.groundY + this.player.height, 6, {
                        angle: -Math.PI / 2,
                        spread: Math.PI * 0.5,
                        speed: 60,
                        colors: ['#8B7355', '#a08060'],
                        size: 5,
                        life: 0.3,
                        gravity: 150,
                        friction: 0.95
                    });
                }
            }

            handleGroundSmash() {
                const currentTime = performance.now();
                if (this.player.groundSmash(currentTime)) {
                    this.pendingGroundSmash = true;
                }
            }

            applyGroundSmashDamage() {
                soundManager.playGroundSmash();
                this.player.triggerSmashEffect();

                // Big screen shake
                this.screenEffects.shake(15, 0.3);
                this.screenEffects.flash('rgba(255, 100, 0, 0.4)', 0.5);
                this.screenEffects.hitstop(0.08);

                // Player landing squash
                this.player.squashX = 1.5;
                this.player.squashY = 0.5;

                // Ground dust particles
                const smashCenter = this.player.getSmashCenter();
                this.particles.emit(smashCenter.x, smashCenter.y, 25, {
                    angle: -Math.PI / 2,
                    spread: Math.PI * 0.8,
                    speed: 250,
                    colors: ['#8B7355', '#a08060', '#6b5535'],
                    size: 12,
                    life: 0.8,
                    gravity: 300,
                    friction: 0.96,
                    offsetX: 60
                });

                // Debris particles
                this.particles.emit(smashCenter.x, smashCenter.y, 10, {
                    angle: -Math.PI / 2,
                    spread: Math.PI * 0.5,
                    speed: 350,
                    colors: ['#555555', '#777777', '#444444'],
                    size: 6,
                    life: 1,
                    gravity: 500,
                    friction: 0.98
                });

                // Damage all zombies in radius
                let killCount = 0;
                this.zombies.forEach(zombie => {
                    if (zombie.dead) return;

                    const zombieCenter = {
                        x: zombie.x + zombie.width / 2,
                        y: zombie.y + zombie.height / 2
                    };

                    const dx = zombieCenter.x - smashCenter.x;
                    const dy = zombieCenter.y - smashCenter.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance <= GROUND_SMASH_RADIUS) {
                        // Knockback based on distance
                        const knockbackDir = dx > 0 ? 1 : -1;
                        const knockbackAmount = 40 * (1 - distance / GROUND_SMASH_RADIUS);

                        soundManager.playHit(0.6 + Math.random() * 0.3);
                        const result = zombie.takeDamage(GROUND_SMASH_DAMAGE, knockbackAmount * knockbackDir);
                        if (result.died) {
                            const scoreMultiplier = zombie.type === ZOMBIE_TYPE.TITAN ? 10 :
                                                   zombie.type === ZOMBIE_TYPE.LARGE ? 3 : 1;
                            this.score += KILL_SCORE * scoreMultiplier;
                            this.highScore = Math.max(this.highScore, this.score);
                            killCount++;
                            soundManager.playZombieDeath();

                            // Clear Titan reference if killed
                            if (zombie.type === ZOMBIE_TYPE.TITAN) {
                                this.activeTitan = null;
                                this.screenEffects.shake(20, 0.5);
                                this.screenEffects.flash('rgba(255, 0, 255, 0.5)', 0.5);
                            }

                            // Check for radioactive death - slow player (already in smash radius)
                            if (result.isRadioactive) {
                                this.playerSlowedUntil = performance.now() + 5000;
                                this.screenEffects.flash('rgba(50, 255, 50, 0.4)', 0.5);
                                // Radioactive death particles
                                this.particles.emit(zombieCenter.x, zombieCenter.y, 20, {
                                    angle: Math.PI / 2,
                                    spread: Math.PI * 2,
                                    speed: 150,
                                    colors: ['#50ff50', '#30cc30', '#80ff80'],
                                    size: 10,
                                    life: 1.2,
                                    gravity: 100,
                                    friction: 0.98
                                });
                            }

                            // Death particles - color based on type
                            const deathColors = zombie.type === ZOMBIE_TYPE.RADIOACTIVE ?
                                ['#50ff50', '#30cc30', '#80ff80', '#8b0000'] :
                                zombie.type === ZOMBIE_TYPE.FAST ?
                                ['#9ab0c0', '#7090a0', '#c0d0e0', '#8b0000'] :
                                zombie.type === ZOMBIE_TYPE.TITAN ?
                                ['#8800ff', '#ff00ff', '#cc00cc', '#4a3a5a'] :
                                zombie.type === ZOMBIE_TYPE.LARGE ?
                                ['#5a6a5a', '#3a4a3a', '#7a8a7a', '#8b0000'] :
                                ['#4a6b4a', '#6b8e6b', '#3d5a3d', '#8b0000'];
                            this.particles.emit(zombieCenter.x, zombieCenter.y, 20 * zombie.scale, {
                                angle: dx > 0 ? 0 : Math.PI,
                                spread: Math.PI * 0.8,
                                speed: 300,
                                colors: deathColors,
                                size: 10 * zombie.scale,
                                life: 1,
                                gravity: 400,
                                friction: 0.97
                            });
                        }

                        // Damage number
                        this.damageNumbers.push(new DamageNumber(
                            zombieCenter.x,
                            zombie.y,
                            GROUND_SMASH_DAMAGE,
                            '#ff6600',
                            true
                        ));

                        this.hitEffects.push({
                            x: zombieCenter.x,
                            y: zombieCenter.y,
                            life: 0.3,
                            type: 'smash'
                        });
                    }
                });

                // Extra effects for multi-kills
                if (killCount >= 3) {
                    this.screenEffects.shake(20, 0.4);
                    this.screenEffects.triggerChromatic(3);
                }
            }

            startGame() {
                this.state = PLAYING;
                this.player = new Player();
                this.base = new Base();
                this.zombies = [];
                this.projectiles = [];
                this.shellCasings = [];
                this.score = 0;
                this.spawnInterval = INITIAL_SPAWN_INTERVAL;
                this.lastSpawnTime = performance.now();
                this.hitEffects = [];
                this.pendingGroundSmash = false;
                this.particles.clear();
                this.damageNumbers = [];
                this.screenEffects = new ScreenEffects();
                this.playerSlowedUntil = 0;
                this.lastLargeZombieScore = 0;
                this.titanAnnouncement = false;
                this.titanAnnouncementTime = 0;
                this.activeTitan = null;
                this.consecutiveJumps = 0;
                this.lastJumpTime = 0;
                this.hasMinigun = false;
                this.minigunUnlockAnnouncement = false;
                this.minigunAnnouncementTime = 0;
                this.punchChargeStart = 0;
                this.isPunchCharging = false;
                this.superPunchReady = false;
                soundManager.playBackgroundMusic();
            }

            checkCollision(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                       rect1.x + rect1.width > rect2.x &&
                       rect1.y < rect2.y + rect2.height &&
                       rect1.y + rect1.height > rect2.y;
            }

            update(currentTime) {
                const deltaTime = (currentTime - this.lastTime) / 1000;
                this.lastTime = currentTime;

                // Always update screen effects and background
                this.screenEffects.update(deltaTime);
                this.background.update(deltaTime);

                if (this.state !== PLAYING) return;

                // Hitstop - pause gameplay briefly
                if (this.screenEffects.isHitstop()) {
                    return;
                }

                // Check if player was in air and just landed with ground smash
                const wasInAir = this.player.y < this.player.groundY;

                // Handle player slowdown from radioactive zombies
                // Check if player is inside any living radioactive zombie's radius
                const playerCenter = {
                    x: this.player.x + this.player.width / 2,
                    y: this.player.y + this.player.height / 2
                };
                let inRadioactiveZone = false;
                for (let zombie of this.zombies) {
                    if (zombie.type === ZOMBIE_TYPE.RADIOACTIVE && !zombie.dead) {
                        const zombieCenter = zombie.getCenter();
                        const dist = Math.sqrt(
                            Math.pow(zombieCenter.x - playerCenter.x, 2) +
                            Math.pow(zombieCenter.y - playerCenter.y, 2)
                        );
                        if (dist <= zombie.radioactiveRadius) {
                            inRadioactiveZone = true;
                            // Apply 5 second slow each frame while in zone
                            this.playerSlowedUntil = currentTime + 5000;
                            break;
                        }
                    }
                }

                if (currentTime < this.playerSlowedUntil) {
                    this.player.speed = this.playerNormalSpeed / 2;
                } else {
                    this.player.speed = this.playerNormalSpeed;
                }

                // Update player
                this.player.update(deltaTime, this.keys);

                // Continuous minigun firing when Q is held
                if (this.hasMinigun && this.keys['q']) {
                    this.handleShoot();
                }

                // Update super punch charge status
                if (this.isPunchCharging) {
                    const chargeTime = performance.now() - this.punchChargeStart;
                    this.player.punchChargeLevel = Math.min(chargeTime / 2000, 1);
                    if (chargeTime >= 2000 && !this.superPunchReady) {
                        this.superPunchReady = true;
                        // Flash to indicate ready
                        this.screenEffects.flash('rgba(255, 255, 0, 0.3)', 0.2);
                    }
                } else {
                    this.player.punchChargeLevel = 0;
                }

                // Landing dust particles and sound
                if (wasInAir && this.player.y >= this.player.groundY && this.player.landSquash > 0) {
                    soundManager.playLand();
                    this.screenEffects.shake(2, 0.08);
                    this.particles.emit(this.player.x + this.player.width / 2, this.player.groundY + this.player.height, 8, {
                        angle: -Math.PI / 2,
                        spread: Math.PI * 0.6,
                        speed: 80,
                        colors: ['#8B7355', '#a08060'],
                        size: 6,
                        life: 0.4,
                        gravity: 200,
                        friction: 0.95
                    });
                }

                // Check for ground smash landing
                if (this.pendingGroundSmash && wasInAir && this.player.y >= this.player.groundY) {
                    this.applyGroundSmashDamage();
                    this.pendingGroundSmash = false;
                }

                // Spawn zombies with different types
                if (currentTime - this.lastSpawnTime >= this.spawnInterval) {
                    // Determine zombie type based on probability
                    // 60% normal, 10% fast, 10% radioactive, 10% jumping, 10% chance nothing (balanced)
                    const roll = Math.random();
                    let zombieType;
                    if (roll < 0.60) {
                        zombieType = ZOMBIE_TYPE.NORMAL;
                    } else if (roll < 0.70) {
                        zombieType = ZOMBIE_TYPE.FAST;
                    } else if (roll < 0.80) {
                        zombieType = ZOMBIE_TYPE.RADIOACTIVE;
                    } else if (roll < 0.90) {
                        zombieType = ZOMBIE_TYPE.JUMPING;
                    } else {
                        zombieType = ZOMBIE_TYPE.NORMAL; // Fill remaining 10% with normal
                    }

                    this.zombies.push(new Zombie(zombieType));
                    this.lastSpawnTime = currentTime;
                    this.spawnInterval = Math.max(MIN_SPAWN_INTERVAL, this.spawnInterval - SPAWN_ACCELERATION);
                }

                // Boss spawn every 100 points
                // 89% Mini Boss only, 10% Titan only, 1% both Mini Boss AND Titan
                if (this.score >= this.lastLargeZombieScore + 100) {
                    this.lastLargeZombieScore = Math.floor(this.score / 100) * 100;
                    const bossRoll = Math.random();

                    if (bossRoll < 0.01) {
                        // 1% chance: BOTH Mini Boss and Titan spawn together!
                        this.zombies.push(new Zombie(ZOMBIE_TYPE.LARGE));
                        this.screenEffects.shake(5, 0.3);
                        this.screenEffects.flash('rgba(100, 50, 0, 0.3)', 0.5);

                        if (!this.activeTitan) {
                            const titan = new Zombie(ZOMBIE_TYPE.TITAN);
                            this.zombies.push(titan);
                            this.activeTitan = titan;
                            this.titanAnnouncement = true;
                            this.titanAnnouncementTime = currentTime;
                            this.screenEffects.shake(15, 1.0);
                            this.screenEffects.flash('rgba(100, 0, 150, 0.5)', 1.0);
                            this.screenEffects.triggerChromatic(5);
                        }
                    } else if (bossRoll < 0.11 && !this.activeTitan) {
                        // 10% chance: Titan instead of Mini Boss
                        const titan = new Zombie(ZOMBIE_TYPE.TITAN);
                        this.zombies.push(titan);
                        this.activeTitan = titan;
                        this.titanAnnouncement = true;
                        this.titanAnnouncementTime = currentTime;
                        this.screenEffects.shake(15, 1.0);
                        this.screenEffects.flash('rgba(100, 0, 150, 0.5)', 1.0);
                        this.screenEffects.triggerChromatic(5);
                    } else {
                        // 89% chance: Just Mini Boss
                        this.zombies.push(new Zombie(ZOMBIE_TYPE.LARGE));
                        this.screenEffects.shake(5, 0.3);
                        this.screenEffects.flash('rgba(100, 50, 0, 0.3)', 0.5);
                    }
                }

                // Update zombies
                this.zombies = this.zombies.filter(zombie => {
                    const result = zombie.update(deltaTime, currentTime, this.base);

                    if (result.remove) return false;

                    // Handle radioactive explosion
                    if (result.radioactiveExplosion) {
                        this.base.takeDamage(50);
                        this.screenEffects.shake(15, 0.4);
                        this.screenEffects.flash('rgba(50, 255, 50, 0.6)', 0.8);
                        this.screenEffects.triggerEdgeFlash('#50ff50');

                        // Big radioactive explosion particles
                        this.particles.emit(zombie.x + zombie.width / 2, zombie.y + zombie.height / 2, 40, {
                            angle: Math.PI / 2,
                            spread: Math.PI * 2,
                            speed: 250,
                            colors: ['#50ff50', '#30cc30', '#80ff80', '#ffff00'],
                            size: 12,
